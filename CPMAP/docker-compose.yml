services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-mcprice}
      POSTGRES_USER: ${DB_USERNAME:-mcprice}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mcprice}
    volumes:
      - mcprice-postgres-data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-mcprice} -d ${DB_NAME:-mcprice}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-mcprice}
      DB_USERNAME: ${DB_USERNAME:-mcprice}
      DB_PASSWORD: ${DB_PASSWORD:-mcprice}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-please-32bytes-minimum}
      JWT_ACCESS_MINUTES: ${JWT_ACCESS_MINUTES:-30}
      JWT_REFRESH_DAYS: ${JWT_REFRESH_DAYS:-7}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      WEBSITE_DRY_RUN: ${WEBSITE_DRY_RUN:-true}
      WEBSITE_PUBLISHER_PROVIDER: ${WEBSITE_PUBLISHER_PROVIDER:-MOCK}
      MERCHANT_DRY_RUN: ${MERCHANT_DRY_RUN:-true}
      MERCHANT_PUBLISHER_PROVIDER: ${MERCHANT_PUBLISHER_PROVIDER:-MOCK}
      MERCHANT_ACCOUNT_ID: ${MERCHANT_ACCOUNT_ID:-}
      MERCHANT_DATA_SOURCE_ID: ${MERCHANT_DATA_SOURCE_ID:-}
      MERCHANT_CREDENTIALS_PATH: ${MERCHANT_CREDENTIALS_PATH:-}
      WOOCOMMERCE_ENABLED: ${WOOCOMMERCE_ENABLED:-false}
      WOOCOMMERCE_BASE_URL: ${WOOCOMMERCE_BASE_URL:-}
      WOOCOMMERCE_CONSUMER_KEY: ${WOOCOMMERCE_CONSUMER_KEY:-}
      WOOCOMMERCE_CONSUMER_SECRET: ${WOOCOMMERCE_CONSUMER_SECRET:-}
      DAILY_PIPELINE_CRON: ${DAILY_PIPELINE_CRON:-0 0 2 * * ?}
      IMPORT_WATCH_DIR: /app/data/import
    volumes:
      - ./data/import:/app/data/import:ro
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3001}:80"

volumes:
  mcprice-postgres-data:
