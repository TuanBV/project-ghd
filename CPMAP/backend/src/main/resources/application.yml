spring:
  application:
    name: mc-price-optimizer
  jackson:
    time-zone: Asia/Ho_Chi_Minh
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mcprice}
    username: ${DB_USERNAME:mcprice}
    password: ${DB_PASSWORD:mcprice}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: always
    properties:
      org:
        quartz:
          scheduler:
            instanceName: McPriceScheduler
            instanceId: AUTO
          jobStore:
            class: org.springframework.scheduling.quartz.LocalDataSourceJobStore
            driverDelegateClass: org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
            isClustered: true
            clusterCheckinInterval: 20000
          threadPool:
            threadCount: 5
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  timezone: Asia/Ho_Chi_Minh
  currency: VND
  import-watch-dir: ${IMPORT_WATCH_DIR:data/import}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:dev-only-change-me-dev-only-change-me-32bytes}
    access-token-minutes: ${JWT_ACCESS_MINUTES:30}
    refresh-token-days: ${JWT_REFRESH_DAYS:7}
  security:
    allowed-crawl-domains:
      - sgt.com.vn
      - dienmay88.vn
      - dienmaythienphu.vn
      - dienmayabc.com
    max-redirects: 3
    crawl-timeout-seconds: 10
    crawl-user-agent: "McPriceOptimizerBot/1.0 (+contact: admin@tongkhodienmaymienbac.com)"
  pricing:
    default-minimum-competitor-count: 2
    default-max-observation-age-hours: 48
    default-rounding-step: 10000
    default-max-increase-percent: 15
    default-max-decrease-percent: 15
    default-outlier-threshold-percent: 30
  publish:
    website:
      dry-run: ${WEBSITE_DRY_RUN:true}
      provider: ${WEBSITE_PUBLISHER_PROVIDER:MOCK}
    merchant:
      dry-run: ${MERCHANT_DRY_RUN:true}
      provider: ${MERCHANT_PUBLISHER_PROVIDER:MOCK}
      account-id: ${MERCHANT_ACCOUNT_ID:}
      data-source-id: ${MERCHANT_DATA_SOURCE_ID:}
      credentials-path: ${MERCHANT_CREDENTIALS_PATH:}
  job:
    daily-pipeline-cron: ${DAILY_PIPELINE_CRON:0 0 2 * * ?}
  woocommerce:
    enabled: ${WOOCOMMERCE_ENABLED:false}
    base-url: ${WOOCOMMERCE_BASE_URL:}
    consumer-key: ${WOOCOMMERCE_CONSUMER_KEY:}
    consumer-secret: ${WOOCOMMERCE_CONSUMER_SECRET:}

resilience4j:
  retry:
    instances:
      competitorCrawl:
        max-attempts: 3
        wait-duration: 1s
        retry-exceptions:
          - java.io.IOException
  circuitbreaker:
    instances:
      competitorCrawl:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} [cid=%X{correlationId}] - %msg%n"
