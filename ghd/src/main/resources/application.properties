spring.application.name=ghd

# App / environment
app.environment=${APP_ENV:local}

# Analytics tracking - salt for hashing visitor IPs before storing (never store raw IPs)
app.analytics.ip-salt=${ANALYTICS_IP_SALT:ghd-analytics-salt}

# Datasource
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:core}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:20150601}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database=mysql
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.datasource.hikari.pool-name=ManagerUser-Pool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.data-source-properties.cachePrepStmts=true
spring.datasource.hikari.data-source-properties.prepStmtCacheSize=250
spring.datasource.hikari.data-source-properties.prepStmtCacheSqlLimit=2048
spring.datasource.hikari.data-source-properties.useServerPrepStmts=true
spring.datasource.hikari.data-source-properties.useLocalSessionState=true
spring.datasource.hikari.data-source-properties.rewriteBatchedStatements=true
spring.datasource.hikari.data-source-properties.cacheResutSetMetadata=true
spring.datasource.hikari.data-source-properties.cacheServerConfiguration=true
spring.datasource.hikari.data-source-properties.elideSetAutoCommits=true
spring.datasource.hikari.data-source-properties.maintainTimeStatus=false
spring.jackson.time-zone=Asia/Ho_Chi_Minh
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh

#Show SQL
#spring.jpa.properties.hibernate.show_sql=true

#Format SQL
#spring.jpa.properties.hibernate.format_sql=true

#Show bind values
#logging.level.org.hibernate.orm.jdbc.bind=trace

# Redis connection
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:2000ms}
spring.data.redis.timeout=${REDIS_COMMAND_TIMEOUT:2000ms}

# Spring Cache (Redis) - see guru.springframework.ghd.config.CacheConfig for per-cache TTLs
spring.cache.type=redis
app.cache.namespace=${spring.application.name}:${app.environment}

# Spring Session (Redis) - HttpSession only; /api/v1/** and /admin/v1/** stay JWT-stateless (see SecurityConfig)
spring.session.store-type=redis
spring.session.timeout=${SESSION_TIMEOUT:30m}
spring.session.data.redis.namespace=${spring.application.name}:${app.environment}:session
spring.session.data.redis.flush-mode=on-save
spring.session.data.redis.save-mode=on-set-attribute
server.servlet.session.cookie.name=${SESSION_COOKIE_NAME:GHDSESSION}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:lax}

#token
jwt.token.secret-key=${JWT_SECRET:f96548f488bf358a16bca90d44d894e680fc2b3becd34c892041d59c7689184ce04e61207ccc3d4c3cb1f7bd0a815756a9c2d4ed9addf2e58dacf2b3dd45111ae95701c26015ff71a22a12178a6d5650333e81af}
jwt.token.expiration=86400000
#aes
aes.secret-key=${AES_SECRET:6e0e4ad0a5d67461c52ec6dffaf74230ce71d9227ee3f9c95370c41408384ac43d4d35e6d743e74d7712acd2dc32a3e8f7901960319c563601e6789997a90da1}
cookie.expiration.default=604800
cookie.domain=${COOKIE_DOMAIN:localhost}
spring.servlet.multipart.enabled=true
spring.servlet.multipart.file-size-threshold=0B
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=500MB
server.tomcat.max-http-form-post-size=200MB
#server.tomcat.max-swallow-size=-1
#server.tomcat.accept-count=100
#server.tomcat.max-part-count=100
upload.path=${UPLOAD_PATH:uploads}
seo.static.path=${SEO_STATIC_PATH:seo}
# Setting mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Log
logging.file.name=${LOG_PATH:logs}/app.log
logging.level.root=ERROR
logging.level.org.springframework.web=error
logging.level.guru.springframework=error
logging.level.guru.springframework.ghd.security=INFO
logging.level.guru.springframework.ghd.services.impl.AnalyticsServiceImpl=WARN
logging.level.guru.springframework.ghd.controllers.api.AnalyticsTrackController=WARN
logging.level.guru.springframework.ghd.listeners.AnalyticsEventListener=WARN
logging.level.org.springframework.kafka=WARN
spring.main.log-startup-info=false
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=true

# Telegram Bot Config
telegram.bot-token=${TELEGRAM_BOT_TOKEN:}
telegram.chat-id=${TELEGRAM_CHAT_ID:}

# VNPay (thanh toán thẻ ngân hàng + trả góp) - xem VnpayServiceImpl và
# .claude/skills/vnpay-payment/SKILL.md. Secret KHÔNG có default - chưa cấu hình thì
# VnpayServiceImpl.buildPaymentUrl fail rõ ràng thay vì âm thầm dùng giá trị sai.
vnpay.tmn-code=${VNPAY_TMN_CODE:}
vnpay.hash-secret=${VNPAY_HASH_SECRET:}
vnpay.pay-url=${VNPAY_PAY_URL:}
vnpay.api-url=${VNPAY_API_URL:}
app.base-url=${APP_BASE_URL:http://localhost:18080}

# Phase 2: tự động huỷ đơn AWAITING_PAYMENT quá hạn + khung đối soát Query API - xem
# PaymentReconciliationServiceImpl và .claude/skills/vnpay-payment/SKILL.md.
app.order.payment-ttl-minutes=${ORDER_PAYMENT_TTL_MINUTES:15}
app.payment.reconcile-grace-minutes=${PAYMENT_RECONCILE_GRACE_MINUTES:3}
app.scheduling.cancel-stale-orders-fixed-delay-ms=${CANCEL_STALE_ORDERS_FIXED_DELAY_MS:60000}
app.scheduling.reconcile-pending-fixed-delay-ms=${RECONCILE_PENDING_FIXED_DELAY_MS:300000}

# Kafka - order/user notification events (see guru.springframework.ghd.config.KafkaTopicConfig)
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.group-id=ghd-notifications
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=guru.springframework.ghd.events

server.forward-headers-strategy=framework

spring.web.resources.cache.cachecontrol.max-age=365d
spring.web.resources.cache.cachecontrol.cache-public=true
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml,image/svg+xml
server.compression.min-response-size=1024

# Graceful shutdown - let in-flight requests finish before the container is stopped
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=25s

# Actuator - health/info only, see SecurityConfig for exposure rules
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.health.redis.enabled=true
management.health.db.enabled=true
# Mail/SMTP is optional business config (Gmail credentials, often unset in fresh
# environments) and unrelated to the container being up - don't let it fail the
# container healthcheck. The task only requires health to reflect DB and Redis.
management.health.mail.enabled=false
