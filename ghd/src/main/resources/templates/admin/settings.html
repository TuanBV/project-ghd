<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{common/admin/header :: header(~{::title}, ~{::link})}">
    <title th:text="${titlePage}"></title>
    <style>
      .rotate-180 {
        transform: rotate(180deg);
      }
      .transition-all {
        transition: all 0.3s ease;
      }

      @keyframes spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }
      .animate-spin {
        animation: spin 1s linear infinite;
        display: inline-block;
      }
    </style>
  </head>
  <body class="bg-gray-50">
    <div th:replace="common/admin/sidebar :: sidebar"></div>

    <section id="content">
      <nav th:replace="common/admin/navbar :: navbar"></nav>

      <main class="p-6">
        <div th:each="entry : ${groupedParams}" class="mb-6 group-container">
          <div
            class="flex justify-between items-center bg-white p-4 cursor-pointer btn-toggle-group hover:bg-gray-50 transition-all"
          >
            <div class="flex items-center gap-3">
              <svg class="text-2xl text-blue-600 transition-all" data-icon="chevron-down" aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="m6 9 6 6 6-6"/></svg>
              <h2
                class="text-lg font-semibold text-gray-700 uppercase mb-0"
                th:text="${entry.key}"
              >
                TÊN NHÓM
              </h2>
            </div>
          </div>
          <div
            class="group-content bg-white overflow-hidden"
          >
            <table class="w-full text-left">
              <tbody class="divide-y divide-gray-100">
                <tr
                  th:each="item : ${entry.value}"
                  class="row-param hover:bg-gray-50 transition"
                >
                  <td class="p-4 w-1/3 border-r border-gray-50">
                    <div
                      class="font-semibold text-gray-700"
                      th:text="${item.paramName}"
                    ></div>
                    <input
                      type="hidden"
                      class="param-key"
                      th:value="${item.paramKey}"
                    />
                  </td>
                  <td class="p-4">
                    <input
                      type="text"
                      class="param-value w-full px-4 py-2 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
                      th:value="${item.paramValue}"
                    />
                  </td>
                </tr>
              </tbody>
            </table>

            <div
              class="p-4 bg-gray-50 border-t border-gray-100 flex justify-end"
            >
              <button
                type="button"
                class="btn-save-group flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-xl transition shadow-md active:scale-95"
              >
                <svg class="text-lg" data-icon="save" aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8"/><path d="M7 3v5h8"/></svg>
                <span class="font-semibold uppercase text-sm"
                  >Cập nhật nhóm này</span
                >
              </button>
            </div>
          </div>
        </div>

        <div class="mb-6 bg-white rounded-xl shadow-sm border border-gray-100 p-6">
          <h2 class="text-lg font-semibold text-gray-700 uppercase mb-4 flex items-center gap-2">
            <svg class="text-blue-600 text-2xl" data-icon="sitemap" aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M12 6v6"/><rect x="9" y="2" width="6" height="4" rx="1"/><rect x="3" y="16" width="6" height="4" rx="1"/><rect x="15" y="16" width="6" height="4" rx="1"/><path d="M6 16v-4h12v4"/></svg> Cấu hình Sitemap.xml
          </h2>

          <form id="form-sitemap" enctype="multipart/form-data" class="flex flex-col sm:flex-row items-stretch sm:items-center gap-4">
            <div class="flex-1 relative">
              <input
                      type="file"
                      id="sitemap-file"
                      name="file"
                      accept=".xml"
                      class="w-full px-4 py-2 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition file:mr-4 file:py-1 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer"
              />
            </div>
            <button
                    type="submit"
                    id="btn-upload-sitemap"
                    class="flex items-center justify-center gap-2 bg-green-600 hover:bg-green-700 text-white px-6 py-2 rounded-xl transition shadow-md active:scale-95 whitespace-nowrap"
            >
              <svg class="text-lg" data-icon="upload" aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M12 21V9"/><path d="m7 14 5-5 5 5"/><path d="M5 3h14"/></svg>
              <span class="font-semibold uppercase text-sm">Tải lên sitemap</span>
            </button>
          </form>
          <p class="text-xs text-gray-400 mt-2">* Chỉ chấp nhận định dạng file .xml (Ví dụ: sitemap.xml)</p>
        </div>
        <div class="mb-6 bg-white rounded-xl shadow-sm border border-gray-100 p-6">
          <h2 class="text-lg font-semibold text-gray-700 uppercase mb-4 flex items-center gap-2">
            <svg class="text-blue-600 text-2xl" data-icon="file-text" aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg> Cau hinh Robots.txt
          </h2>

          <form id="form-robots" enctype="multipart/form-data" class="flex flex-col sm:flex-row items-stretch sm:items-center gap-4">
            <div class="flex-1 relative">
              <input
                      type="file"
                      id="robots-file"
                      name="file"
                      accept=".txt"
                      class="w-full px-4 py-2 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition file:mr-4 file:py-1 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer"
              />
            </div>
            <button
                    type="submit"
                    id="btn-upload-robots"
                    class="flex items-center justify-center gap-2 bg-green-600 hover:bg-green-700 text-white px-6 py-2 rounded-xl transition shadow-md active:scale-95 whitespace-nowrap"
            >
              <svg class="text-lg" data-icon="upload" aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M12 21V9"/><path d="m7 14 5-5 5 5"/><path d="M5 3h14"/></svg>
              <span class="font-semibold uppercase text-sm">Tải lên robots</span>
            </button>
          </form>
          <p class="text-xs text-gray-400 mt-2">* Chi chap nhan file robots.txt</p>
        </div>
      </main>
    </section>

    <script>
      window.addEventListener('load', function() {
        // 1. Xử lý đóng/mở nhóm khi click vào header
        $(".btn-toggle-group").click(function () {
          const $container = $(this).closest(".group-container");
          const $content = $container.find(".group-content");
          const $icon = $(this).find('[data-icon="chevron-down"]');

          $content.slideToggle(300);
          $icon.toggleClass("rotate-180");
        });

        // 2. Xử lý lưu dữ liệu (nút Lưu giờ nằm trong group-content)
        $(".btn-save-group").click(function () {
          const $button = $(this);
          const $container = $button.closest(".group-container");
          const dataToUpdate = [];

          // Thu thập dữ liệu
          $container.find(".row-param").each(function () {
            const key = $(this).find(".param-key").val();
            const value = $(this).find(".param-value").val();
            dataToUpdate.push({ paramKey: key, paramValue: value });
          });

          if (dataToUpdate.length === 0) return;

          // Hiệu ứng Loading
          const originalContent = $button.html();
          $button
            .prop("disabled", true)
            .addClass("opacity-70 cursor-not-allowed")
            .html(
              '<svg class="animate-spin" data-icon="loader-alt" aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.2-8.6"/></svg> Đang xử lý...'
            );

          $.ajax({
            url: "/api/v1/sys-param",
            type: "PUT",
            contentType: "application/json",
            data: JSON.stringify(dataToUpdate),
            success: function () {
              Toast.fire({ icon: "success", title: "Cập nhật dữ liệu thành công!" });
            },
            error: function (xhr) {
              alert("Lỗi: " + (xhr.responseText || "Không thể lưu dữ liệu"));
            },
            complete: function () {
              $button
                .prop("disabled", false)
                .removeClass("opacity-70 cursor-not-allowed")
                .html(originalContent);
            },
          });
        });

        $("#form-sitemap").submit(function (e) {
          e.preventDefault(); // Chặn việc submit form tải lại trang

          const fileInput = document.getElementById('sitemap-file');
          if (fileInput.files.length === 0) {
            alert("Vui lòng chọn một file sitemap.xml trước khi tải lên!");
            return;
          }

          const file = fileInput.files[0];
          // Kiểm tra nhanh đuôi file ở client
          if (!file.name.endsWith('.xml')) {
            alert("Vui lòng chỉ chọn file có định dạng .xml!");
            return;
          }

          const $button = $("#btn-upload-sitemap");
          const originalContent = $button.html();

          // Tạo đối tượng FormData để truyền file qua AJAX
          const formData = new FormData(this);

          // Hiệu ứng Loading cho nút upload
          $button
                  .prop("disabled", true)
                  .addClass("opacity-70 cursor-not-allowed")
                  .html('<svg class="animate-spin" data-icon="loader-alt" aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.2-8.6"/></svg> Đang tải lên...');

          $.ajax({
            url: "/api/v1/sys-param/sitemap", // Đường dẫn API xử lý upload trên Spring Boot của bạn
            type: "POST",
            data: formData,
            processData: false, // Bắt buộc khi gửi FormData
            contentType: false, // Bắt buộc khi gửi FormData
            success: function (response) {
              Toast.fire({ icon: "success", title: "Tải lên sitemap.xml thành công!" });
              fileInput.value = ""; // Reset input file sau khi thành công
            },
            error: function (xhr) {
              alert("Lỗi upload: " + (xhr.responseText || "Không thể tải file lên hệ thống"));
            },
            complete: function () {
              $button
                      .prop("disabled", false)
                      .removeClass("opacity-70 cursor-not-allowed")
                      .html(originalContent);
            },
          });
        });

        $("#form-robots").submit(function (e) {
          e.preventDefault();

          const fileInput = document.getElementById('robots-file');
          if (fileInput.files.length === 0) {
            alert("Vui lòng chọn file robots.txt trước khi tải lên!");
            return;
          }

          const file = fileInput.files[0];
          if (!file.name.toLowerCase().endsWith('.txt')) {
            alert("Vui lòng chọn file .txt!");
            return;
          }

          const $button = $("#btn-upload-robots");
          const originalContent = $button.html();
          const formData = new FormData(this);

          $button
                  .prop("disabled", true)
                  .addClass("opacity-70 cursor-not-allowed")
                  .html('<svg class="animate-spin" data-icon="loader-alt" aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.2-8.6"/></svg> Đang tải lên...');

          $.ajax({
            url: "/api/v1/sys-param/seo-file/robots",
            type: "POST",
            data: formData,
            processData: false,
            contentType: false,
            success: function () {
              Toast.fire({ icon: "success", title: "Tải lên robots.txt thành công!" });
              fileInput.value = "";
            },
            error: function (xhr) {
              alert("Loi upload: " + (xhr.responseText || "Không thể tải file lên hệ thống"));
            },
            complete: function () {
              $button
                      .prop("disabled", false)
                      .removeClass("opacity-70 cursor-not-allowed")
                      .html(originalContent);
            },
          });
        });
      });
    </script>
  </body>
</html>
