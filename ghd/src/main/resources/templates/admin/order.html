<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{common/admin/header :: header(~{::title}, ~{::link})}">
    <title>Quản lý Đơn hàng - Green Home Shop</title>
  </head>
  <body class="bg-gray-50">
    <div th:replace="common/admin/sidebar :: sidebar"></div>

    <section id="content">
      <nav th:replace="common/admin/navbar :: navbar"></nav>

      <main class="p-6">
        <div class="max-w-full mx-auto">
          <div class="flex items-center justify-between mb-6">
            <h1 class="text-2xl font-semibold text-gray-700">
              Quản lý Đơn hàng
            </h1>
          </div>

          <div
            class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 mb-6"
          >
            <form
              id="searchForm"
              class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4"
            >
              <div class="flex flex-col gap-1">
                <label
                  class="text-xs font-semibold text-gray-600 uppercase ml-1"
                  >Mã đơn / Tên khách</label
                >
                <div class="relative flex-1">
                  <input
                    id="searchKeyword"
                    type="text"
                    placeholder="Nhập tên hoặc mã..."
                    class="w-full h-10 ps-10 pe-4 rounded-xl border border-gray-200 focus:ring-2 focus:ring-blue-500 outline-none text-sm transition-all"
                  />
                  <span class="absolute inset-y-0 left-0 flex items-center ps-3 pointer-events-none"
                  >
                    <svg class="text-gray-600 text-xl" data-icon="search" aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
                  </span>
                </div>
              </div>
              <div class="flex flex-col gap-1">
                <label
                  class="text-xs font-semibold text-gray-600 uppercase ml-1"
                  >Số điện thoại</label
                >
                <input
                  id="searchPhone"
                  type="text"
                  placeholder="09xxx..."
                  class="w-full h-10 px-4 rounded-xl border border-gray-200 focus:ring-2 focus:ring-blue-500 outline-none text-sm transition-all"
                />
              </div>
              <div class="flex flex-col gap-1">
                <label
                  class="text-xs font-semibold text-gray-600 uppercase ml-1"
                  >Trạng thái</label
                >
                <select
                  id="searchStatus"
                  class="w-full h-10 px-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-blue-500 outline-none text-sm bg-white cursor-pointer"
                >
                  <option value="">Tất cả trạng thái</option>
                  <option value="PENDING">Chờ xác nhận</option>
                  <option value="CONFIRMED">Đã xác nhận</option>
                  <option value="SHIPPING">Đang giao hàng</option>
                  <option value="COMPLETED">Đã hoàn thành</option>
                  <option value="CANCELLED">Đã hủy</option>
                </select>
              </div>
              <div class="flex flex-col gap-1">
                <label
                  class="text-xs font-semibold text-gray-600 uppercase ml-1"
                  >Từ ngày - Đến ngày</label
                >
                <div class="flex items-center gap-2">
                  <input
                    id="startDate"
                    type="date"
                    class="w-full h-10 px-2 rounded-xl border border-gray-200 text-sm outline-none focus:ring-2 focus:ring-blue-500"
                  />
                  <input
                    id="endDate"
                    type="date"
                    class="w-full h-10 px-2 rounded-xl border border-gray-200 text-sm outline-none focus:ring-2 focus:ring-blue-500"
                  />
                </div>
              </div>
              <div class="lg:col-span-4 flex justify-end gap-3 border-t pt-4">
                <button
                  type="reset"
                  class="px-6 py-2 bg-gray-100 text-gray-600 rounded-xl text-sm font-semibold hover:bg-gray-200 transition"
                >
                  Đặt lại
                </button>
                <button
                  type="submit"
                  class="px-6 py-2 bg-blue-600 text-white rounded-xl text-sm font-semibold hover:bg-blue-700 shadow-lg shadow-blue-100 transition"
                >
                  Áp dụng lọc
                </button>
              </div>
            </form>
          </div>

          <div
            class="flex flex-col md:flex-row items-center justify-end gap-4 mb-4"
          >
            <div class="flex items-center gap-3">
              <select
                id="pageSize"
                class="h-10 border border-gray-200 rounded-xl text-sm px-3 bg-white shadow-sm outline-none"
              >
                <option value="10">10 đơn hàng</option>
                <option value="25">25 đơn hàng</option>
                <option value="50">50 đơn hàng</option>
              </select>
              <select
                id="sortCategories"
                class="h-10 border border-gray-200 rounded-xl text-sm px-3 bg-white shadow-sm outline-none"
              >
                <option value="created_date,desc">Mới nhất trước</option>
                <option value="created_date,asc">Cũ nhất trước</option>
              </select>
            </div>
          </div>

          <div
            class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden"
          >
            <div class="overflow-x-auto">
              <table class="min-w-full">
                <thead class="bg-gray-50 border-b border-gray-100">
                  <tr>
                    <th
                      class="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase"
                    >
                      Ngày đặt
                    </th>
                    <th
                      class="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase"
                    >
                      Khách hàng
                    </th>
                    <th
                      class="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase"
                    >
                      Tổng tiền
                    </th>
                    <th
                      class="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase"
                    >
                      Thanh toán
                    </th>
                    <th
                      class="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase"
                    >
                      Trạng thái
                    </th>
                    <th
                      class="px-6 py-3 text-right text-xs font-semibold text-gray-600 uppercase"
                    >
                      Thao tác
                    </th>
                  </tr>
                </thead>
                <tbody id="order-list" class="divide-y divide-gray-100"></tbody>
              </table>
            </div>
            <div

              <span

                class="text-sm text-gray-600 font-medium"
              ></span>
              <div
                id="pagination-buttons"
                class="flex items-center gap-1"
              ></div>
            </div>
          </div>
        </div>

        <div
          id="orderModal"
          class="hidden fixed inset-0 bg-gray-900/60 backdrop-blur-sm flex items-center justify-center z-[9999]"
        >
          <div
            class="bg-white rounded-2xl w-full max-w-5xl shadow-2xl relative animate-fade-in mx-4 flex flex-col max-h-[90vh]"
          >
            <div
              class="p-6 border-b border-gray-100 flex items-center justify-between"
            >
              <h2
                class="text-2xl font-semibold text-gray-700 flex items-center gap-2"
              >
                <svg class="text-blue-600 text-3xl" data-icon="receipt" aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2z"/><path d="M8 7h8M8 12h8M8 17h5"/></svg> Chi tiết &
                Xử lý đơn hàng
              </h2>
              <button
                type="button"
                class="text-gray-600 hover:text-red-500 text-3xl transition-colors cursor-pointer"
                onclick="closeModal()"
              >
                &times;
              </button>
            </div>

            <div
              id="orderDetailContent"
              class="p-6 overflow-y-auto flex-1 custom-scrollbar"
            >
              <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                <div
                  class="bg-blue-50/50 p-4 rounded-xl border border-blue-100"
                >
                  <label
                    class="block text-xs font-semibold text-blue-400 uppercase mb-1"
                    >Khách hàng</label
                  >
                  <p
                    id="viewFullName"
                    class="text-base font-semibold text-gray-800"
                  >
                    -
                  </p>
                  <p
                    id="viewPhone"
                    class="text-sm font-semibold text-blue-600 mt-1"
                  >
                    -
                  </p>
                </div>
                <div class="bg-gray-50 p-4 rounded-xl border border-gray-100">
                  <label
                    class="block text-xs font-semibold text-gray-600 uppercase mb-1"
                    >Địa chỉ nhận hàng</label
                  >
                  <p id="viewAddress" class="text-sm text-gray-700 font-medium">
                    -
                  </p>
                </div>
              </div>

              <div
                class="mb-8 border border-gray-200 rounded-xl overflow-hidden shadow-sm"
              >
                <div
                  class="bg-gray-50 px-4 py-2.5 border-b text-xs font-semibold text-gray-600 uppercase"
                >
                  Sản phẩm trong đơn hàng
                </div>
                <div class="overflow-x-auto">
                  <table class="w-full text-left text-sm">
                    <thead
                      class="bg-gray-100/50 text-[10px] uppercase text-gray-600 font-semibold"
                    >
                      <tr>
                        <th class="px-6 py-3">Sản phẩm</th>
                        <th class="px-6 py-3 text-center">Số lượng</th>
                        <th class="px-6 py-3 text-right">Đơn giá</th>
                        <th class="px-6 py-3 text-right">Thành tiền</th>
                      </tr>
                    </thead>
                    <tbody
                      id="viewOrderItems"
                      class="divide-y divide-gray-100 bg-white"
                    ></tbody>
                    <tfoot class="bg-gray-50">
                      <tr class="text-gray-600 border-t">
                        <td
                          colspan="3"
                          class="px-6 py-2 text-right text-sm font-medium"
                        >
                          Tổng tiền hàng:
                        </td>
                        <td
                          id="viewSubTotal"
                          class="px-6 py-2 text-right text-sm font-semibold"
                        >
                          0đ
                        </td>
                      </tr>
<!--                      <tr class="text-emerald-600">-->
<!--                        <td-->
<!--                          colspan="3"-->
<!--                          class="px-6 py-2 text-right text-sm font-medium"-->
<!--                        >-->
<!--                          Giảm giá (Mua cùng DM khác):-->
<!--                        </td>-->
<!--                        <td-->
<!--                          id="viewDiscount"-->
<!--                          class="px-6 py-2 text-right text-sm font-semibold"-->
<!--                        >-->
<!--                          -0đ-->
<!--                        </td>-->
<!--                      </tr>-->
                      <tr class="font-semibold text-gray-800 bg-blue-50/50">
                        <td
                          colspan="3"
                          class="px-6 py-4 text-right text-base uppercase"
                        >
                          Tổng thanh toán:
                        </td>
                        <td
                          id="viewTotalAmount"
                          class="px-6 py-4 text-right text-2xl text-red-600"
                        >
                          0đ
                        </td>
                      </tr>
                    </tfoot>
                  </table>
                </div>
              </div>

              <div class="mb-6">
                <label
                  class="block text-sm font-semibold text-amber-600 mb-2 flex items-center gap-1"
                >
                  <svg class="" data-icon="comment-dots" aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"/><path d="M8 11h.01M12 11h.01M16 11h.01"/></svg> Ghi chú từ khách hàng:
                </label>
                <div
                  id="customerNoteDisplay"
                  class="w-full px-4 py-3 bg-amber-50 border border-amber-100 rounded-xl text-sm text-gray-600 italic min-h-[40px]"
                >
                  -
                </div>
              </div>

              <hr class="my-6 border-gray-100" />

              <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                  <label
                    class="block text-sm font-semibold text-gray-700 mb-2 flex items-center gap-1"
                  >
                    <svg class="" data-icon="refresh" aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M21 12a9 9 0 0 1-15.3 6.4L3 16"/><path d="M3 21v-5h5"/><path d="M3 12A9 9 0 0 1 18.3 5.6L21 8"/><path d="M21 3v5h-5"/></svg> Cập nhật trạng thái
                  </label>
                  <select
                    id="status"
                    class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none bg-white text-sm font-semibold text-gray-700 shadow-sm"
                  >
                    <option value="PENDING">🕒 Chờ xác nhận (PENDING)</option>
                    <option value="CONFIRMED">
                      ✅ Đã xác nhận (CONFIRMED)
                    </option>
                    <option value="SHIPPING">
                      🚚 Đang giao hàng (SHIPPING)
                    </option>
                    <option value="COMPLETED">
                      🎉 Đã hoàn thành (COMPLETED)
                    </option>
                    <option value="CANCELLED">❌ Đã hủy (CANCELLED)</option>
                  </select>
                </div>
                <div>
                  <label
                    class="block text-sm font-semibold text-gray-700 mb-2 flex items-center gap-1"
                  >
                    <svg class="" data-icon="edit" aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg> Ghi chú nội bộ (Admin)
                  </label>
                  <textarea
                    id="adminNote"
                    rows="2"
                    class="h-[47px] w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition text-sm shadow-sm"
                    placeholder="Nhập lưu ý nội bộ..."
                  ></textarea>
                </div>
              </div>
            </div>

            <div class="p-6 border-t border-gray-100 bg-gray-50 rounded-b-2xl">
              <form id="orderForm">
                <input type="hidden" id="orderId" />
                <div class="flex gap-4">
                  <button
                    type="button"
                    onclick="closeModal()"
                    class="flex-1 px-4 py-3 bg-white border border-gray-300 text-gray-700 rounded-xl hover:bg-gray-50 font-semibold transition shadow-sm cursor-pointer"
                  >
                    Đóng
                  </button>
                  <button
                    type="submit"
                    id="btnSave"
                    class="flex-[2] px-4 py-3 bg-blue-600 text-white rounded-xl hover:bg-blue-700 font-semibold shadow-lg shadow-blue-200 transition"
                  >
                    <svg class="" data-icon="save" aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8"/><path d="M7 3v5h8"/></svg> Cập nhật đơn hàng
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </main>
    </section>

    <script>
      const API_BASE = "/api/v1/order";

      const DEFAULTS = {
        PAGE: 1,
        SIZE: "10",
        SORT_FIELD: "created_date",
        SORT_DIR: "desc",
      };

      let currentPage = DEFAULTS.PAGE;

      window.addEventListener("load", function () {
        fetchOrders(DEFAULTS.PAGE);
        $("#pageSize, #sortCategories").on("change", () =>
          fetchOrders(DEFAULTS.PAGE),
        );
        $("#searchForm")
          .on("submit", (e) => {
            e.preventDefault();
            fetchOrders(DEFAULTS.PAGE);
          })
          .on("reset", function () {
            setTimeout(() => fetchOrders(DEFAULTS.PAGE), 10);
          });
      });

      function fetchOrders(page) {
        currentPage = page;
        const sort = $("#sortCategories").val().split(",");
        const keyword = $("#searchKeyword").val();
        const pageSize = $("#pageSize").val();

        const params = {
          "ma-don-hang": keyword,
          "ten-khach-hang": keyword,
          "so-dien-thoai": $("#searchPhone").val(),
          "trang-thai": $("#searchStatus").val(),
          "ngay-bat-dau": $("#startDate").val(),
          "ngay-ket-thuc": $("#endDate").val(),
          "thuoc-tinh": sort[0],
          "kieu-sap-xep": sort[1],
          trang: page,
          "so-ban-ghi": pageSize,
        };

        Object.keys(params).forEach((key) => {
          const val = params[key];
          const isDefault =
            (key === "trang" && val === DEFAULTS.PAGE) ||
            (key === "so-ban-ghi" && val === DEFAULTS.SIZE) ||
            (key === "thuoc-tinh" && val === DEFAULTS.SORT_FIELD) ||
            (key === "kieu-sap-xep" && val === DEFAULTS.SORT_DIR);

          if (!val || isDefault) delete params[key];
        });

        $.get(API_BASE, params, function (data) {
          const res = data.body || data;
          renderTable(res.content || []);
          renderPagination(res.totalPages, page);
        }).fail(() => {
          $("#order-list").html(
            '<tr><td colspan="6" class="p-10 text-center text-red-500">Lỗi tải dữ liệu.</td></tr>',
          );
        });
      }

      function renderTable(orders) {
        const $tbody = $("#order-list").empty();
        if (!orders.length) {
          $tbody.append(
            '<tr><td colspan="6" class="p-20 text-center text-gray-600"><svg class="text-5xl mb-3 block" data-icon="package" aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="m21 8-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>Không tìm thấy đơn hàng</td></tr>',
          );
          return;
        }

        orders.forEach((item) => {
          $tbody.append(`
        <tr class="hover:bg-blue-50/40 transition border-b border-gray-50">
            <td class="px-6 py-4 text-xs text-gray-600 font-medium">${formatDate(item.createdDate)}</td>
            <td class="px-6 py-4">
                <div class="text-sm font-semibold text-gray-700">${item.customerName}</div>
                <div class="text-xs text-blue-600 font-semibold">${item.customerPhone}</div>
            </td>
            <td class="px-6 py-4 text-sm font-semibold text-red-600">${(item.totalAmount || 0).toLocaleString("vi-VN")}đ</td>
            <td class="px-6 py-4">
                <span class="text-[10px] font-semibold text-gray-600 border border-gray-200 px-2 py-0.5 rounded bg-white">${item.paymentMethod || "COD"}</span>
                ${item.paymentStatus ? `<span class="${getPaymentStatusBadgeClass(item.paymentStatus)} ml-1">${item.paymentStatus}</span>` : ""}
            </td>
            <td class="px-6 py-4"><span class="${getStatusBadgeClass(item.status)}">${item.status}</span></td>
            <td class="px-6 py-4 text-right">
                <button onclick="viewDetail('${item.id}')" class="px-4 py-1.5 bg-white border border-blue-200 rounded-xl text-xs font-semibold text-blue-600 hover:bg-blue-600 hover:text-white transition shadow-sm cursor-pointer">Xử lý</button>
            </td>
        </tr>
      `);
        });
      }

      function renderPagination(totalPages, current) {
        const $container = $("#pagination-container");
        const $buttons = $("#pagination-buttons").empty();

        if (totalPages <= 1) {
          $container.addClass("hidden");
          return;
        }

        $container.removeClass("hidden");
        $("#page-info").text(`Trang ${current} / ${totalPages}`);

        const start = Math.max(1, current - 2);
        const end = Math.min(totalPages, current + 2);

        for (let i = start; i <= end; i++) {
          const activeClass =
            i === current
              ? "bg-blue-600 text-white shadow-md shadow-blue-200"
              : "bg-white text-gray-600 hover:bg-blue-50";
          $buttons.append(
            `<button onclick="fetchOrders(${i})" class="w-8 h-8 rounded-xl border border-gray-200 text-xs font-semibold transition cursor-pointer ${activeClass}">${i}</button>`,
          );
        }
      }

      function viewDetail(id) {
        $.get(`${API_BASE}/${id}`, function (data) {
          const item = data.body || data;
          if (!item) return;

          // 1. Gán thông tin khách hàng & trạng thái
          $("#orderId").val(item.id);
          $("#viewFullName").text(item.customerName || "-");
          $("#viewPhone").text(item.customerPhone || "-");
          $("#viewAddress").text(item.shippingAddress || "N/A");
          $("#customerNoteDisplay").text(
            item.note || "(Khách hàng không để lại ghi chú)",
          );
          $("#status").val(item.status);
          $("#adminNote").val(item.adminNote || "");
          $("#adminNoteDisplay").text(item.adminNote || "Không có ghi chú");

          // 2. Tính toán Giảm giá dựa trên danh mục (categoryName) từ dữ liệu sản phẩm
          let discountVal = 0;
          const categories = new Set();

          if (item.orderItems && item.orderItems.length > 0) {
            item.orderItems.forEach((prod) => {
              // Lưu ý: Đảm bảo API trả về trường categoryName hoặc categoryId trong orderItems
              if (prod.categoryName) {
                categories.add(prod.categoryName);
              }
            });
          }

          // Logic: Nếu có từ 2 danh mục khác nhau trở lên thì giảm giá
          if (categories.size > 1) {
            discountVal = (categories.size - 1) * 200000;
          }

          // 3. Hiển thị tiền tệ
          const totalAmount = item.totalAmount || 0;
          // Lưu ý: subTotal ở đây là tổng giá trị đơn hàng trước khi trừ giảm giá
          const subTotal = totalAmount + discountVal;

          $("#viewSubTotal").text(subTotal.toLocaleString("vi-VN") + "đ");
          // $("#viewDiscount").text(
          //   "-" + discountVal.toLocaleString("vi-VN") + "đ",
          // );
          $("#viewTotalAmount").text(totalAmount.toLocaleString("vi-VN") + "đ");

          // 4. Render danh sách sản phẩm vào bảng
          const $itemsBody = $("#viewOrderItems").empty();
          if (item.orderItems && item.orderItems.length > 0) {
            item.orderItems.forEach((prod) => {
              $itemsBody.append(`
          <tr class="hover:bg-gray-50/50 transition">
            <td class="px-6 py-4">
              <div class="flex items-center gap-4">
                <div class="w-12 h-12 rounded border shadow-sm overflow-hidden bg-white flex-shrink-0">
                  <img
                    src="${prod.image && !prod.image.includes(".") ? prod.image + "_mobile.webp" : prod.image || "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"}"
                    class="w-full h-full object-contain"
                    onerror="this.src = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7'"
                  />
                </div>
                <div>
                  <div class="text-sm font-semibold text-gray-700">${prod.productName}</div>
                  <div class="text-[10px] text-blue-500 font-medium px-1.5 py-0.5 bg-blue-50 rounded w-fit mt-1">
                    ${prod.categoryName || "Chưa phân loại"}
                  </div>
                  <div class="text-[11px] text-gray-500 mt-1">
                    Mẫu: ${prod.color || ""}, ${prod.size || ""}
                  </div>
                </div>
              </div>
            </td>
            <td class="px-6 py-4 text-center font-semibold text-gray-700">${prod.quantity}</td>
            <td class="px-6 py-4 text-right text-gray-600">${(prod.price || 0).toLocaleString("vi-VN")}đ</td>
            <td class="px-6 py-4 text-right font-semibold text-blue-600">
                ${(prod.totalItemAmount || prod.price * prod.quantity).toLocaleString("vi-VN")}đ
            </td>
          </tr>
        `);
            });
          } else {
            $itemsBody.append(
              '<tr><td colspan="4" class="p-10 text-center text-gray-500 italic">Không có dữ liệu sản phẩm</td></tr>',
            );
          }

          // 5. Mở Modal
          $("#orderModal").removeClass("hidden").addClass("flex");
        }).fail(() => {
          Swal.fire({
            icon: "error",
            title: "Lỗi",
            text: "Không thể lấy thông tin đơn hàng",
          });
        });
      }

      $("#orderForm").on("submit", function (e) {
        e.preventDefault();
        const btn = $("#btnSave");
        btn
          .prop("disabled", true)
          .html(
            '<svg class="animate-spin" data-icon="loader-alt" aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.2-8.6"/></svg> Đang cập nhật...',
          );

        const payload = {
          status: $("#status").val(),
          adminNote: $("#adminNote").val(),
        };

        $.ajax({
          url: `${API_BASE}/${$("#orderId").val()}`,
          method: "PUT",
          contentType: "application/json",
          data: JSON.stringify(payload),
          success: function () {
            closeModal();
            fetchOrders(currentPage);
            Swal.fire({
              icon: "success",
              title: "Cập nhật thành công",
              timer: 1500,
              showConfirmButton: false,
            });
          },
          error: () => Swal.fire({ icon: "error", title: "Lỗi cập nhật" }),
          complete: () =>
            btn
              .prop("disabled", false)
              .html('<svg class="" data-icon="save" aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8"/><path d="M7 3v5h8"/></svg> Cập nhật đơn hàng'),
        });
      });

      function getStatusBadgeClass(status) {
        const base =
          "px-2.5 py-1 rounded-full text-[10px] font-semibold uppercase ";
        const maps = {
          PENDING: "bg-orange-100 text-orange-700",
          CONFIRMED: "bg-blue-100 text-blue-700",
          SHIPPING: "bg-purple-100 text-purple-700",
          COMPLETED: "bg-emerald-100 text-emerald-700",
          CANCELLED: "bg-rose-100 text-rose-700",
          AWAITING_PAYMENT: "bg-yellow-100 text-yellow-700",
          PAYMENT_FAILED: "bg-rose-100 text-rose-700",
        };
        return base + (maps[status] || "bg-gray-100 text-gray-600");
      }

      // paymentStatus null/undefined cho đơn COD/BANK_TRANSFER (không có Payment) -
      // chỉ hiện badge này cho đơn CARD/INSTALLMENT qua VNPay.
      function getPaymentStatusBadgeClass(paymentStatus) {
        const base =
          "px-2 py-0.5 rounded text-[10px] font-semibold uppercase ";
        const maps = {
          PENDING: "bg-yellow-100 text-yellow-700",
          SUCCESS: "bg-emerald-100 text-emerald-700",
          FAILED: "bg-rose-100 text-rose-700",
          CANCELLED: "bg-gray-200 text-gray-600",
        };
        return base + (maps[paymentStatus] || "bg-gray-100 text-gray-600");
      }

      function closeModal() {
        $("#orderModal").addClass("hidden").removeClass("flex");
        $("#orderForm")[0].reset();
      }

      function formatDate(dateStr) {
        if (!dateStr) return "N/A";
        const d = new Date(dateStr);
        return (
          d.toLocaleDateString("vi-VN") +
          " " +
          d.toLocaleTimeString("vi-VN", { hour: "2-digit", minute: "2-digit" })
        );
      }
      $(window).on("click", function (event) {
        const modal = document.getElementById("orderModal");
        if (event.target === modal) {
          closeModal();
        }
      });
    </script>

    <style>
      .animate-fade-in {
        animation: fadeIn 0.25s ease-out;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Thanh cuộn tùy chỉnh */
      .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: #f8fafc;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 10px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }
    </style>
  </body>
</html>
