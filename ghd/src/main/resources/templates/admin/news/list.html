<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{common/admin/header :: header(~{::title}, ~{::link})}">
    <title>Quản lý Bài viết - Green Home Shop</title>
  </head>
  <body class="bg-gray-50 text-gray-700">
    <div th:replace="common/admin/sidebar :: sidebar"></div>

    <section id="content">
      <nav th:replace="common/admin/navbar :: navbar"></nav>

      <main class="p-6">
        <div class="max-w-full mx-auto">
          <div
            class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8"
          >
            <div>
              <h1 class="text-2xl font-semibold text-gray-700">
                Quản lý Bài viết
              </h1>
              <p class="text-sm text-gray-600 mt-1">
                Tin tức, bài viết dịch vụ và tối ưu SEO trang web
              </p>
            </div>
            <a
              href="/admin/v1/news/add"
              class="flex items-center justify-center gap-2 px-5 py-2.5 bg-blue-600 text-white rounded-xl font-semibold shadow-lg shadow-blue-200 hover:bg-blue-700 hover:-translate-y-0.5 transition-all active:scale-95"
            >
              <svg class="text-xl" data-icon="plus-circle" aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg> Viết bài mới
            </a>
          </div>

          <div
          <div
            class="flex flex-col md:flex-row items-center gap-4 mb-6 bg-white p-4 rounded-2xl border border-gray-100 shadow-sm"
          >
            <div class="relative flex-1">
              <span class="absolute inset-y-0 left-0 flex items-center ps-3 pointer-events-none"
              >
                    <svg class="text-gray-600 text-xl" data-icon="search" aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
                  </span>
              <input
                id="searchInput"
                type="text"
                placeholder="Tìm tiêu đề bài viết..."
                class="w-full pl-11 pr-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 outline-none transition"
              />
            </div>
            <select
              id="filterStatus"
              class="w-full md:w-60 px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm font-medium focus:ring-2 focus:ring-blue-500 outline-none cursor-pointer"
            >
              <option value="">Tất cả trạng thái</option>
              <option value="DRAFT">Bản nháp (DRAFT)</option>
              <option value="PUBLISHED">Đã xuất bản (PUBLISHED)</option>
            </select>
            <p
              class="text-sm font-medium text-gray-600 whitespace-nowrap"
              id="stat-count"
            >
              Đang tải...
            </p>
          </div>

          <div
            class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden"
          >
            <div class="overflow-x-auto">
              <table class="min-w-full">
                <thead class="bg-gray-50 border-b border-gray-100">
                  <tr>
                    <th
                      class="px-6 py-4 text-left text-xs font-semibold text-gray-600 uppercase tracking-widest"
                    >
                      Nội dung bài viết
                    </th>
                    <th
                      class="px-6 py-4 text-left text-xs font-semibold text-gray-600 uppercase tracking-widest"
                    >
                      Danh mục
                    </th>
                    <th
                            class="px-6 py-4 text-left text-xs font-semibold text-gray-600 uppercase tracking-widest"
                    >
                      Thương hiệu
                    </th>
                    <th
                      class="px-6 py-4 text-center text-xs font-semibold text-gray-600 uppercase tracking-widest"
                    >
                      Lượt xem
                    </th>
                    <th
                      class="px-6 py-4 text-center text-xs font-semibold text-gray-600 uppercase tracking-widest"
                    >
                      Trạng thái
                    </th>
                    <th
                      class="px-6 py-4 text-right text-xs font-semibold text-gray-600 uppercase tracking-widest"
                    >
                      Thao tác
                    </th>
                  </tr>
                </thead>
                <tbody
                  id="news-list"
                  class="divide-y divide-gray-50 transition-opacity duration-200"
                ></tbody>
              </table>
            </div>

            <div
              id="pagination-container"
              class="px-6 py-4 border-t border-gray-100 bg-gray-50 flex flex-col md:flex-row items-center justify-between gap-4"
            >
              <span
                id="page-info"
                class="text-sm text-gray-600 font-medium"
              ></span>
              <div
                id="pagination-buttons"
                class="flex items-center gap-1"
              ></div>
            </div>
          </div>
        </div>
      </main>
    </section>

    <script th:inline="javascript">
      const API_BASE = "/api/v1/news";
      const EMPTY_IMG =
        "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7";
      let currentPage = 1;

      $(document).ready(() => {
        fetchNews(1);
        $("#filterStatus").on("change", () => fetchNews(1));
        $("#searchInput").on(
          "input",
          debounce(() => fetchNews(1), 500),
        );
      });

      // Cơ chế Retry và hiển thị lỗi ảnh đồng bộ với Product
      function handleImageError(img) {
        let attempts = parseInt(img.getAttribute("data-retry") || "0");
        if (attempts < 3) {
          attempts++;
          img.setAttribute("data-retry", attempts);
          setTimeout(() => {
            const timestamp = new Date().getTime();
            const originalSrc = img.src.split("?")[0];
            img.src = `${originalSrc}?retry=${timestamp}`;
          }, 1000);
        } else {
          img.onerror = null;
          img.src = EMPTY_IMG;
          $(img)
            .closest(".img-wrapper")
            .addClass("bg-gray-100")
            .html('<svg class="text-gray-300 text-xl" data-icon="image" aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10.5" r="1.5"/><path d="m21 15-5-5L5 19"/></svg>');
        }
      }

      function fetchNews(page) {
        currentPage = page;
        const params = {
          title: $("#searchInput").val().trim(),
          status: $("#filterStatus").val(),
          page: page - 1,
          size: 10,
          field: "created_date",
          sort: "desc",
        };

        $("#news-list").css("opacity", "0.5");

        $.get(API_BASE, params, function (res) {
          const data = res.body || res;
          renderTable(data.content || []);
          renderPagination(data.totalPages, page, data.totalElements);
          $("#stat-count").text(`Tổng: ${data.totalElements} bài viết`);
        })
          .fail(() => {
            Toast.fire({ icon: "error", title: "Lỗi tải danh sách bài viết" });
          })
          .always(() => {
            $("#news-list").css("opacity", "1");
          });
      }

      function renderTable(list) {
        const $tbody = $("#news-list").empty();
        const t = new Date().getTime();

        if (!list || list.length === 0) {
          $tbody.append(`
            <tr>
              <td colspan="5" class="py-20 text-center text-gray-600 italic">
                <svg class="text-6xl mb-4 opacity-20" data-icon="search-alt" aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
                <p class="text-lg font-medium">Không tìm thấy bài viết nào phù hợp.</p>
              </td>
            </tr>`);
          return;
        }

        list.forEach((item) => {
          // Xử lý đường dẫn ảnh WebP đa kích thước
          const baseImg = item.thumbnail
            ? item.thumbnail.replace(/\.[^/.]+$/, "")
            : null;

          let imageHtml = `<div class="w-12 h-12 rounded-lg border border-gray-100 flex items-center justify-center overflow-hidden bg-gray-50 img-wrapper flex-shrink-0">`;

          if (baseImg) {
            imageHtml += `
              <picture>
                <source media="(min-width: 1024px)" srcset="${baseImg}_pc.webp?t=${t}">
                <img src="${baseImg}_sm.webp?t=${t}"
                     onerror="handleImageError(this)"
                     class="w-full h-full object-cover"
                     loading="lazy">
              </picture>`;
          } else {
            imageHtml += `<svg class="text-gray-300 text-xl" data-icon="image" aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10.5" r="1.5"/><path d="m21 15-5-5L5 19"/></svg>`;
          }
          imageHtml += `</div>`;

          const statusBadge =
            item.status === "PUBLISHED"
              ? `<span class="px-2.5 py-1 bg-emerald-100 text-emerald-700 rounded-lg text-[10px] font-semibold uppercase">Đã đăng</span>`
              : `<span class="px-2.5 py-1 bg-amber-100 text-amber-700 rounded-lg text-[10px] font-semibold uppercase">Bản nháp</span>`;

          $tbody.append(`
            <tr class="hover:bg-gray-50/50 transition border-b border-gray-50 last:border-0">
              <td class="px-6 py-4">
                <div class="flex items-center gap-3">
                  ${imageHtml}
                  <div class="min-w-0">
                    <div class="text-sm font-semibold text-gray-700 line-clamp-1 mb-0.5">${item.title}</div>
                    <div class="flex items-center gap-2">
                      <span class="text-[10px] text-gray-600 flex items-center gap-1">
                        <svg class="" data-icon="calendar" aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg> ${formatDate(item.createdDate)}
                      </span>
                      ${item.isFeatured ? '<span class="text-[9px] bg-orange-100 text-orange-600 px-1.5 py-0.5 rounded font-semibold uppercase">Nổi bật</span>' : ""}
                    </div>
                  </div>
                </div>
              </td>
              <td class="px-6 py-4">
                <span class="px-2.5 py-1 bg-gray-100 text-gray-600 rounded-lg text-[10px] font-semibold uppercase">
                  ${item.categoryName || "Chung"}
                </span>
              </td>
              <td class="px-6 py-4">
                <span class="px-2.5 py-1 bg-gray-100 text-gray-600 rounded-lg text-[10px] font-semibold uppercase">
                  ${item.brandName || "Chung"}
                </span>
              </td>
              <td class="px-6 py-4 text-center">
                <div class="text-sm font-medium text-gray-600">
                  <svg class="text-[#191919]" data-icon="show" aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg> ${item.viewCount || 0}
                </div>
              </td>
              <td class="px-6 py-4 text-center">${statusBadge}</td>
              <td class="px-6 py-4 text-right space-x-1">
                <a href="/admin/v1/news/edit/${item.id}" class="p-2 text-blue-600 hover:bg-blue-50 rounded-xl transition inline-block" title="Chỉnh sửa">
                   <svg class="text-xl" data-icon="edit-alt" aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
                </a>
                <button onclick="deleteNews('${item.id}')" class="p-2 text-rose-600 hover:bg-rose-50 rounded-xl transition cursor-pointer" title="Xóa bài">
                    <svg class="text-xl" data-icon="trash" aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v5M14 11v5"/></svg>
                </button>
              </td>
            </tr>
          `);
        });
      }

      function renderPagination(totalPages, current, totalElements) {
        const $buttons = $("#pagination-buttons").empty();
        const $container = $("#pagination-container");

        if (totalPages <= 1) {
          $container.addClass("hidden");
          return;
        }
        $container.removeClass("hidden");
        $("#page-info").text(`Trang ${current} / ${totalPages}`);

        const range = 2;
        for (let i = 1; i <= totalPages; i++) {
          if (
            i === 1 ||
            i === totalPages ||
            (i >= current - range && i <= current + range)
          ) {
            const isActive = i === current;
            const btn = $(`
                <button class="w-9 h-9 rounded-xl text-xs font-semibold transition-all cursor-pointer
                ${isActive ? "bg-blue-600 text-white shadow-md shadow-blue-200" : "bg-white text-gray-600 border border-gray-100 hover:bg-gray-50"}">
                    ${i}
                </button>`);
            btn.on("click", () => fetchNews(i));
            $buttons.append(btn);
          } else if (i === current - range - 1 || i === current + range + 1) {
            $buttons.append(`<span class="px-2 text-[#191919]">...</span>`);
          }
        }
      }

      function deleteNews(id) {
        Swal.fire({
          title: "Xóa bài viết?",
          text: "Dữ liệu sẽ được chuyển vào thùng rác và không thể hoàn tác trực tiếp!",
          icon: "warning",
          showCancelButton: true,
          confirmButtonColor: "#ef4444",
          confirmButtonText: "Đồng ý xóa",
          cancelButtonText: "Hủy",
          customClass: {
            confirmButton: "rounded-xl",
            cancelButton: "rounded-xl",
          },
        }).then((result) => {
          if (result.isConfirmed) {
            $.ajax({
              url: `${API_BASE}/${id}`,
              type: "DELETE",
              success: () => {
                Toast.fire({ icon: "success", title: "Đã xóa bài viết!" });
                fetchNews(currentPage);
              },
              error: () =>
                Toast.fire({
                  icon: "error",
                  title: "Lỗi: Không thể xóa bài viết",
                }),
            });
          }
        });
      }

      function formatDate(dateStr) {
        if (!dateStr) return "-";
        return new Date(dateStr).toLocaleDateString("vi-VN");
      }

      function debounce(fn, delay) {
        let timeout;
        return (...args) => {
          clearTimeout(timeout);
          timeout = setTimeout(() => fn(...args), delay);
        };
      }
    </script>

    <style>
      .line-clamp-1 {
        display: -webkit-box;
        -webkit-line-clamp: 1;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
    </style>
  </body>
</html>
