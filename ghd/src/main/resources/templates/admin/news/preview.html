<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xem trước bài viết - Green Home Shop</title>
  <link rel="preload" href="/client/css/app.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="/client/css/app.css"></noscript>
<style>
    svg[data-icon] {
      display: inline-block;
      width: 1em;
      height: 1em;
      vertical-align: -0.125em;
      flex-shrink: 0;
      line-height: 1;
    }

    button svg[data-icon],
    a svg[data-icon],
    [role="button"] svg[data-icon],
    .flex > svg[data-icon],
    .inline-flex > svg[data-icon] {
      align-self: center;
    }

    .article-content { line-height: 1.8; color: #334155; }
    .article-content p { margin-bottom: 1.5rem; font-size: 1.1rem; }
    .article-content h2 { font-size: 1.75rem; font-weight: 700; margin-top: 2rem; margin-bottom: 1rem; color: #0f172a; }
    .article-content img { border-radius: 0.75rem; margin: 2rem auto; box-shadow: 0 4px 12px rgb(0 0 0 / 0.08); width: 100%; height: auto; }
    .breadcrumb-item + .breadcrumb-item::before { content: "/"; padding: 0 8px; color: #cbd5e1; }

    .se-image-container.__se__float-center { display: flex !important; justify-content: center; width: 100% !important; }
    .se-image-container.__se__float-center figure { margin-left: auto; margin-right: auto; }
    .sun-editor-editable strong, .sun-editor-editable b { font-family: inherit !important; font-weight: bold; }

    .news-content table { width: 100% !important; border-collapse: collapse !important; margin: 1.5rem 0 !important; border: 1px solid #e2e8f0 !important; }
    .news-content table td, .news-content table th { padding: 10px 15px !important; border: 1px solid #e2e8f0 !important; vertical-align: middle; }
    .news-content table tr:first-child td { background-color: #f8fafc; font-weight: 600; }
    .news-content a { color: #007bff !important; text-decoration: underline; }

    .preview-badge {
      position: fixed; top: 10px; left: 10px; background: #ef4444; color: white;
      padding: 4px 12px; border-radius: 20px; font-size: 10px; font-weight: bold;
      z-index: 9999; text-transform: uppercase; letter-spacing: 1px;
    }
  </style>
</head>
<body class="bg-[#f8fafc] text-gray-700">
<div class="preview-badge">Chế độ xem trước</div>

<main class="container mx-auto px-4 md:px-10 py-8">
  <nav class="flex mb-8 text-sm font-medium text-gray-600 px-2">
    <ol class="inline-flex items-center space-x-1 md:space-x-2">
      <li class="breadcrumb-item">Trang chủ</li>
      <li class="breadcrumb-item">Tin tức</li>
      <li class="breadcrumb-item active text-gray-700 line-clamp-1" id="p-breadcrumb"></li>
    </ol>
  </nav>

  <div class="flex flex-col lg:flex-row gap-10">
    <div class="w-full lg:w-3/4 bg-white rounded-2xl p-6 md:p-12 border border-gray-100 shadow-sm">
      <article>
        <header class="mb-10">
          <div class="flex items-center gap-3 mb-6">
            <span id="p-category" class="px-3 py-1 bg-blue-100 text-blue-700 rounded-md text-[10px] font-semibold uppercase tracking-wider"></span>
            <span class="text-gray-600 text-sm flex items-center gap-1">
                            <svg class="" data-icon="calendar-alt" aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg> <span id="p-date"></span>
                        </span>
          </div>

          <h1 id="p-title" class="text-3xl md:text-5xl font-semibold text-gray-900 mb-8 leading-tight tracking-tight"></h1>

          <div class="flex flex-wrap items-center justify-between py-6 border-y border-gray-50 gap-4">
            <div class="flex items-center gap-3">
              <div class="w-11 h-11 rounded-full bg-blue-600 flex items-center justify-center text-white shadow-lg shadow-blue-100">
                <svg class="text-2xl" data-icon="user-circle" aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor" ><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 5a3 3 0 1 1 0 6 3 3 0 0 1 0-6zm-5 12a5.5 5.5 0 0 1 10 0 8 8 0 0 1-10 0z"/></svg>
              </div>
              <div>
                <p class="text-gray-900 font-semibold text-sm">Green Home Shop Editor</p>
                <p class="text-gray-600 text-[10px] uppercase font-semibold tracking-tighter">Biên tập viên cấp cao</p>
              </div>
            </div>
            <div class="flex items-center gap-4">
              <div class="flex items-center gap-1.5 text-gray-600 bg-gray-50 px-3 py-1.5 rounded-full">
                <svg class="text-xl" data-icon="show" aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
                <span class="text-sm font-semibold">0 lượt xem</span>
              </div>
            </div>
          </div>
        </header>

        <div class="article-content max-w-none">
          <div id="p-summary" class="font-medium text-xl text-gray-700 mb-10 leading-relaxed border-l-4 border-blue-600 pl-6 bg-blue-50/30 rounded-r-2xl text-justify"></div>

          <div class="mb-10 rounded-2xl overflow-hidden shadow-lg bg-gray-100" id="thumbnail-container">
            <img id="p-thumbnail" src="" class="w-full h-auto object-cover">
          </div>

          <div id="p-content" class="news-content sun-editor-editable"></div>
        </div>

        <footer class="mt-16 pt-8 border-t border-gray-100 flex flex-wrap justify-between items-center gap-6">
          <div class="flex items-center gap-3">
            <span class="text-[11px] font-semibold text-gray-600 uppercase tracking-widest">Thương hiệu liên quan:</span>
            <span id="p-brand" class="px-4 py-1.5 bg-gray-50 text-gray-600 rounded-full text-xs font-semibold border border-gray-100"></span>
          </div>
        </footer>
      </article>
    </div>

    <aside class="w-full lg:w-1/4 space-y-8">
      <div class="bg-white p-7 rounded-2xl border border-gray-100 shadow-sm opacity-50 pointer-events-none">
        <h3 class="text-lg font-semibold text-gray-800 mb-7 flex items-center gap-2">
          <span class="w-1.5 h-6 bg-blue-600 rounded-full"></span> Tin nổi bật
        </h3>
        <p class="text-xs text-gray-400">Nội dung sidebar sẽ hiển thị ở trang chính thức...</p>
      </div>

      <div class="bg-gradient-to-br from-blue-700 to-blue-900 p-8 rounded-2xl text-white shadow-xl">
        <h3 class="text-xl font-semibold mb-4 uppercase tracking-tight">Green Home Shop Smart</h3>
        <p class="text-blue-100 text-xs mb-8">Nội dung xem trước không bao gồm các tin tức liên quan khác.</p>
      </div>
    </aside>
  </div>
</main>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const rawData = localStorage.getItem("newsPreviewClient");
    if (!rawData) {
      alert("Không tìm thấy dữ liệu xem trước!");
      return;
    }

    const data = JSON.parse(rawData);

    // Render Title & Breadcrumb
    document.getElementById("p-title").innerText = data.title || "Chưa nhập tiêu đề";
    document.getElementById("p-breadcrumb").innerText = data.title || "";

    // Render Category & Brand
    document.getElementById("p-category").innerText = data.category || "Chung";
    document.getElementById("p-brand").innerText = data.brand || "Chung";

    // Render Date (Ngày hiện tại)
    const now = new Date();
    document.getElementById("p-date").innerText = now.toLocaleDateString('vi-VN');

    // Render Summary (Tóm tắt)
    if (data.summary) {
      document.getElementById("p-summary").innerText = data.summary;
      document.getElementById("p-summary").style.display = "block";
    } else {
      document.getElementById("p-summary").style.display = "none";
    }

    // Render Thumbnail (Ảnh đại diện)
    if (data.thumbnail) {
      document.getElementById("p-thumbnail").src = data.thumbnail;
      document.getElementById("thumbnail-container").style.display = "block";
    } else {
      document.getElementById("thumbnail-container").style.display = "none";
    }

    // Render Content (Nội dung SunEditor)
    document.getElementById("p-content").innerHTML = data.content || "<p class='text-gray-400'>Nội dung bài viết đang để trống...</p>";
  });
</script>
</body>
</html>
