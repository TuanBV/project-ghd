<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{common/admin/header :: header(~{::title}, ~{::link})}">
    <title>Quản lý Liên hệ - Green Home Shop</title>
  </head>
  <body class="bg-gray-50">
    <div th:replace="common/admin/sidebar :: sidebar"></div>

    <section id="content">
      <nav th:replace="common/admin/navbar :: navbar"></nav>

      <main class="p-6">
        <div class="max-w-full mx-auto">
          <div class="flex items-center justify-between mb-6">
            <h1 class="text-2xl font-semibold text-gray-700">
              Quản lý Liên hệ Khách hàng
            </h1>
            <div class="flex gap-2 text-sm">
              <span
                class="px-3 py-1 bg-blue-100 text-blue-700 rounded-full font-semibold"
                id="stat-total"
                >Tổng: 0</span
              >
            </div>
          </div>

          <div
            class="flex flex-col md:flex-row items-center justify-between gap-4 mb-6"
          >
            <div class="flex items-center gap-4 w-full md:w-auto">
              <form
                id="searchForm"
                class="relative flex items-center w-full md:w-[400px] h-10 rounded-xl bg-white border border-gray-200 focus-within:ring-2 focus-within:ring-blue-500 transition-all shadow-sm"
              >
                <input
                  id="searchInput"
                  type="search"
                  placeholder="Tìm theo tên hoặc số điện thoại..."
                  class="peer h-full w-full outline-none text-sm text-gray-700 bg-transparent ps-4"
                />
                <button
                  type="submit"
                  class="grid place-items-center h-full w-12 text-gray-600 peer-focus:text-blue-500"
                >
                  <svg class="text-xl" data-icon="search" aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
                </button>
              </form>
            </div>

            <div class="flex items-center gap-3 w-full md:w-auto">
              <select
                id="pageSize"
                class="h-10 border border-gray-200 rounded-xl text-sm px-3 bg-white cursor-pointer shadow-sm focus:ring-2 focus:ring-blue-500 outline-none"
              >
                <option value="10">10 bản ghi</option>
                <option value="25">25 bản ghi</option>
                <option value="50">50 bản ghi</option>
              </select>

              <select
                id="sortCategories"
                class="h-10 border border-gray-200 rounded-xl text-sm px-3 bg-white shadow-sm focus:ring-2 focus:ring-blue-500 outline-none"
              >
                <option value="created_date,desc">Mới nhất trước</option>
                <option value="created_date,asc">Cũ nhất trước</option>
              </select>
            </div>
          </div>

          <div
            class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden"
          >
            <div class="overflow-x-auto">
              <table class="min-w-full">
                <thead class="bg-gray-50 border-b border-gray-100">
                  <tr>
                    <th
                      class="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider"
                    >
                      Ngày gửi
                    </th>
                    <th
                      class="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider"
                    >
                      Khách hàng
                    </th>
                    <th
                      class="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider"
                    >
                      Dịch vụ
                    </th>
                    <th
                      class="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider"
                    >
                      Trạng thái
                    </th>
                    <th
                      class="px-6 py-3 text-right text-xs font-semibold text-gray-600 uppercase tracking-wider"
                    >
                      Thao tác
                    </th>
                  </tr>
                </thead>
                <tbody
                  id="contact-list"
                  class="divide-y divide-gray-100"
                ></tbody>
              </table>
            </div>

            <div
              id="pagination-container"
              class="px-6 py-4 border-t border-gray-100 bg-gray-50 flex flex-col md:flex-row items-center justify-between gap-4"
            >
              <span
                id="page-info"
                class="text-sm text-gray-600 font-medium"
              ></span>
              <div
                id="pagination-buttons"
                class="flex items-center gap-1"
              ></div>
            </div>
          </div>
        </div>

        <div
          id="contactModal"
          class="hidden fixed inset-0 bg-gray-900/60 backdrop-blur-sm flex items-center justify-center z-[9999]"
        >
          <div
            class="bg-white p-6 rounded-2xl w-full max-w-lg shadow-2xl relative animate-fade-in mx-4"
          >
            <button
              type="button"
              class="absolute top-4 right-4 text-gray-600 hover:text-blue-900 text-2xl transition cursor-pointer"
              onclick="closeModal()"
            >
              &times;
            </button>

            <h2
              class="text-xl font-semibold text-gray-700 mb-6 flex items-center gap-2"
            >
              <svg class="text-blue-600" data-icon="info-circle" aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg> Chi tiết & Xử lý
              Liên hệ
            </h2>

            <form id="contactForm" class="space-y-5">
              <input type="hidden" id="contactId" />

              <div
                class="grid grid-cols-2 gap-4 bg-blue-50/50 p-4 rounded-xl border border-blue-100"
              >
                <div>
                  <label
                    class="block text-[10px] font-semibold text-blue-400 uppercase tracking-wider"
                    >Khách hàng</label
                  >
                  <p
                    id="viewFullName"
                    class="text-sm font-semibold text-gray-800"
                  >
                    -
                  </p>
                </div>
                <div>
                  <label
                    class="block text-[10px] font-semibold text-blue-400 uppercase tracking-wider"
                    >Số điện thoại</label
                  >
                  <p id="viewPhone" class="text-sm font-semibold text-blue-600">
                    -
                  </p>
                </div>
              </div>

              <div>
                <label
                  class="block text-[10px] font-semibold text-gray-600 uppercase tracking-wider mb-1"
                  >Dịch vụ quan tâm</label
                >
                <p
                  id="viewService"
                  class="text-sm text-gray-700 font-medium bg-gray-50 px-3 py-2 rounded-xl border border-gray-100"
                >
                  -
                </p>
              </div>

              <div>
                <label
                  class="block text-[10px] font-semibold text-gray-600 uppercase tracking-wider mb-1"
                  >Lời nhắn</label
                >
                <div
                  id="viewMessage"
                  class="p-3 bg-gray-50 rounded-xl text-sm text-gray-600 border border-gray-100 italic min-h-[60px]"
                ></div>
              </div>

              <div class="border-t border-dashed border-gray-200 pt-4">
                <label class="block text-sm font-semibold text-gray-700 mb-2"
                  >Trạng thái xử lý</label
                >
                <select
                  id="status"
                  class="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none bg-white transition cursor-pointer"
                >
                  <option value="NEW">Mới nhận (NEW)</option>
                  <option value="PROCESSING">Đang xử lý (PROCESSING)</option>
                  <option value="COMPLETED">Đã hoàn thành (COMPLETED)</option>
                  <option value="CANCELLED">Hủy bỏ (CANCELLED)</option>
                </select>
              </div>

              <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2"
                  >Ghi chú nội bộ</label
                >
                <textarea
                  id="note"
                  rows="3"
                  class="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
                  placeholder="Nhập ghi chú xử lý (VD: Khách hẹn gọi lại sau...)"
                ></textarea>
              </div>

              <div class="flex gap-3 pt-2">
                <button
                  type="button"
                  onclick="closeModal()"
                  class="flex-1 px-4 py-2.5 bg-gray-100 text-gray-700 rounded-xl hover:bg-gray-200 font-semibold transition cursor-pointer"
                >
                  Đóng
                </button>
                <button
                  type="submit"
                  id="btnSave"
                  class="flex-1 px-4 py-2.5 bg-blue-600 text-white rounded-xl hover:bg-blue-700 font-semibold shadow-lg shadow-blue-200 transition"
                >
                  Lưu cập nhật
                </button>
              </div>
            </form>
          </div>
        </div>
      </main>
    </section>

    <script>
      const API_BASE = "/api/v1/contact";
      let currentPage = 1;

      $(document).ready(() => {
        fetchContacts(1);
        $("#pageSize, #sortCategories").on("change", () => fetchContacts(1));
        $("#searchInput").on(
          "keyup",
          debounce(() => fetchContacts(1), 500),
        );
      });

      function fetchContacts(page) {
        currentPage = page;
        const sort = $("#sortCategories").val().split(",");
        const params = {
          search: $("#searchInput").val(),
          sortField: sort[0],
          sortDir: sort[1],
          pageNumber: page,
          pageSize: $("#pageSize").val(),
        };

        $.get(API_BASE, params, function (res) {
          const data = res.body || res;
          renderTable(data.content || []);
          renderPagination(data.totalPages, page, data.totalElements);
          $("#stat-total").text(`Tổng: ${data.totalElements}`);
        }).fail(() => {
          $("#contact-list").html(
            '<tr><td colspan="5" class="p-10 text-center text-red-500">Lỗi kết nối máy chủ</td></tr>',
          );
        });
      }

      function renderTable(contacts) {
        const $tbody = $("#contact-list").empty();
        if (!contacts.length) {
          $tbody.append(
            '<tr><td colspan="5" class="p-10 text-center text-gray-600">Không có dữ liệu hiển thị</td></tr>',
          );
          return;
        }

        contacts.forEach((item) => {
          $tbody.append(`
                <tr class="hover:bg-blue-50/30 transition border-b border-gray-50">
                    <td class="px-6 py-4 text-xs text-gray-600 font-medium">${formatDate(
                      item.createdDate,
                    )}</td>
                    <td class="px-6 py-4">
                        <div class="text-sm font-semibold text-gray-700">${
                          item.fullName
                        }</div>
                        <div class="text-xs text-blue-600 font-semibold">${
                          item.phone
                        }</div>
                    </td>
                    <td class="px-6 py-4 text-sm text-gray-600">${
                      item.serviceType ||
                      '<span class="text-gray-300">N/A</span>'
                    }</td>
                    <td class="px-6 py-4"><span class="${getStatusBadgeClass(
                      item.status,
                    )}">${item.status}</span></td>
                    <td class="px-6 py-4 text-right">
                        <button onclick="viewDetail('${
                          item.id
                        }')" class="px-4 py-1.5 bg-white border border-blue-200 rounded-xl text-xs font-semibold text-blue-600 hover:bg-blue-600 hover:text-white transition shadow-sm cursor-pointer">
                            <svg class="" data-icon="edit-alt" aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg> Xử lý
                        </button>
                    </td>
                </tr>
            `);
        });
      }

      function viewDetail(id) {
        $.get(`${API_BASE}/${id}`, function (res) {
          const item = res.body || res;
          $("#contactId").val(item.id);
          $("#viewFullName").text(item.fullName);
          $("#viewPhone").text(item.phone);
          $("#viewService").text(item.serviceType || "Không xác định");
          $("#viewMessage").text(
            item.message || "Khách hàng không để lại lời nhắn.",
          );
          $("#status").val(item.status);
          $("#note").val(item.note || "");
          $("#contactModal").removeClass("hidden").addClass("flex");
        });
      }

      $("#contactForm").on("submit", function (e) {
        e.preventDefault();
        const btn = $("#btnSave");
        btn.prop("disabled", true).text("Đang lưu...");

        $.ajax({
          url: `${API_BASE}/${$("#contactId").val()}`,
          method: "PUT",
          contentType: "application/json",
          data: JSON.stringify({
            status: $("#status").val(),
            note: $("#note").val(),
          }),
          success: function () {
            closeModal();
            fetchContacts(currentPage);
            Toast.fire({ icon: "success", title: "Cập nhật thành công!" });
          },
          error: () =>
            Toast.fire({ icon: "error", title: "Cập nhật thất bại!" }),
          complete: () => btn.prop("disabled", false).text("Lưu cập nhật"),
        });
      });

      function getStatusBadgeClass(status) {
        const base =
          "px-2.5 py-1 rounded-full text-[10px] font-semibold uppercase ";
        switch (status) {
          case "NEW":
            return base + "bg-blue-100 text-blue-700";
          case "PROCESSING":
            return base + "bg-amber-100 text-amber-700";
          case "COMPLETED":
            return base + "bg-emerald-100 text-emerald-700";
          case "CANCELLED":
            return base + "bg-rose-100 text-rose-700";
          default:
            return base + "bg-gray-100 text-gray-600";
        }
      }

      function closeModal() {
        $("#contactModal").addClass("hidden").removeClass("flex");
        $("#contactForm")[0].reset();
      }

      function formatDate(dateStr) {
        if (!dateStr) return "";
        const d = new Date(dateStr);
        return (
          d.toLocaleDateString("vi-VN") +
          " " +
          d.toLocaleTimeString("vi-VN", { hour: "2-digit", minute: "2-digit" })
        );
      }

      function debounce(fn, delay) {
        let timeout;
        return (...args) => {
          clearTimeout(timeout);
          timeout = setTimeout(() => fn(...args), delay);
        };
      }

      function renderPagination(totalPages, current, totalElements) {
        const $container = $("#pagination-container");
        const $buttons = $("#pagination-buttons").empty();
        if (totalPages <= 1 && totalElements === 0) {
          $container.addClass("hidden");
          return;
        }

        $container.removeClass("hidden");
        $("#page-info").text(`Trang ${current} / ${totalPages}`);

        for (let i = 1; i <= totalPages; i++) {
          const active =
            i === current
              ? "bg-blue-600 text-white shadow-md shadow-blue-200"
              : "bg-white text-gray-600 hover:bg-blue-50";
          $buttons.append(
            `<button onclick="fetchContacts(${i})" class="w-8 h-8 rounded-xl border border-gray-200 text-xs font-semibold transition cursor-pointer ${active}">${i}</button>`,
          );
        }
      }
    </script>

    <style>
      .animate-fade-in {
        animation: fadeIn 0.25s ease-out;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Tùy chỉnh thanh cuộn cho đẹp */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f1f1;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #3b82f6;
      }
    </style>
  </body>
</html>
