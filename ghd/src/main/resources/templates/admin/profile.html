<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{common/admin/header :: header(~{::title}, ~{::link})}">
    <title>Hồ sơ cá nhân - Green Home Shop</title>
    <style>
      input:focus {
        transform: translateY(-1px);
      }

      input[readonly] {
        background-color: #f3f4f6;
        border-color: #e5e7eb;
        color: #6b7280;
      }

      input[readonly]:focus {
        transform: none;
        box-shadow: none;
      }

      input[type="password"],
      input[type="text"] {
        transition: all 0.2s;
      }

      .toggle-password {
        transition: color 0.2s;
      }

      @media (max-width: 640px) {
        h1 {
          font-size: 1.25rem;
        }
        .p-6 {
          padding: 1rem;
        }
      }

      /* Style bổ sung cho viền đỏ khi lỗi */
      .border-red-500 {
        border-color: #ef4444 !important;
      }
    </style>
  </head>
  <body class="bg-gray-50">
    <div th:replace="common/admin/sidebar :: sidebar"></div>

    <section id="content">
      <nav th:replace="common/admin/navbar :: navbar"></nav>

      <main class="p-6">
        <div class="max-w-5xl mx-auto">
          <div class="mb-8 text-center md:text-left">
            <h1 class="text-2xl font-semibold text-gray-700">
              Cài đặt tài khoản
            </h1>
            <p class="text-sm text-gray-600">
              Chào mừng,
              <span
                class="font-semibold text-blue-600"
                th:text="${user.fullName}"
                >Admin</span
              >. Bạn có thể quản lý thông tin tại đây.
            </p>
          </div>

          <div class="grid grid-cols-1 gap-8">
            <div
              class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden transition-all hover:shadow-md"
            >
              <div
                class="p-6 border-b border-gray-50 flex items-center gap-3 bg-white"
              >
                <svg class="text-2xl text-blue-600" data-icon="id-card" aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="12" r="2"/><path d="M14 10h4M14 14h3M7 16c.7-1.3 3.3-1.3 4 0"/></svg>
                <h2 class="text-lg font-semibold text-gray-700">
                  Thông tin định danh
                </h2>
              </div>
              <div class="p-6">
                <form
                  id="profileForm"
                  class="grid grid-cols-1 md:grid-cols-2 gap-6"
                >
                  <div class="flex flex-col gap-1.5">
                    <label
                      class="text-xs font-semibold text-gray-600 uppercase ml-1"
                      >Tên đăng nhập (Username)</label
                    >
                    <div class="relative">
                      <svg class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-600 text-lg" data-icon="lock-alt" aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
                      <input
                        type="text"
                        name="username"
                        th:value="${user.username}"
                        readonly
                        class="w-full h-11 ps-10 pe-4 rounded-xl border border-gray-200 bg-gray-100 text-gray-600 cursor-not-allowed text-sm outline-none shadow-inner"
                        title="Username không thể thay đổi"
                      />
                    </div>
                  </div>

                  <div class="flex flex-col gap-1.5">
                    <label
                      class="text-xs font-semibold text-gray-600 uppercase ml-1"
                      >Họ và tên</label
                    >
                    <div class="relative">
                      <svg class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-600 text-lg" data-icon="rename" aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M4 20h16"/><path d="M6 16 16.5 5.5a2.1 2.1 0 0 1 3 3L9 19l-4 1z"/></svg>
                      <input
                        type="text"
                        name="fullName"
                        th:value="${user.fullName}"
                        placeholder="Nhập họ tên..."
                        class="w-full h-11 ps-10 pe-4 rounded-xl border border-gray-200 focus:ring-2 focus:ring-blue-500 outline-none text-sm transition-all"
                      />
                    </div>
                    <span
                      class="error-msg text-red-500 text-[11px] ml-1 hidden"
                    ></span>
                  </div>

                  <div class="flex flex-col gap-1.5">
                    <label
                      class="text-xs font-semibold text-gray-600 uppercase ml-1"
                      >Địa chỉ Email</label
                    >
                    <div class="relative">
                      <svg class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-600 text-lg" data-icon="envelope" aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
                      <input
                        type="email"
                        name="email"
                        th:value="${user.email}"
                        placeholder="example@domain.com"
                        class="w-full h-11 ps-10 pe-4 rounded-xl border border-gray-200 focus:ring-2 focus:ring-blue-500 outline-none text-sm transition-all"
                      />
                    </div>
                    <span
                      class="error-msg text-red-500 text-[11px] ml-1 hidden"
                    ></span>
                  </div>

                  <div class="flex flex-col gap-1.5">
                    <label
                      class="text-xs font-semibold text-gray-600 uppercase ml-1"
                      >Số điện thoại</label
                    >
                    <div class="relative">
                      <svg class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-600 text-lg" data-icon="phone" aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.4 19.4 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 2 .7 2.9a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.2-1.2a2 2 0 0 1 2.1-.5c.9.3 1.9.6 2.9.7a2 2 0 0 1 1.7 2z"/></svg>
                      <input
                        type="text"
                        name="phone"
                        th:value="${user.phone}"
                        placeholder="09xxxxxxxx"
                        class="w-full h-11 ps-10 pe-4 rounded-xl border border-gray-200 focus:ring-2 focus:ring-blue-500 outline-none text-sm transition-all"
                      />
                    </div>
                    <span
                      class="error-msg text-red-500 text-[11px] ml-1 hidden"
                    ></span>
                  </div>

                  <div class="md:col-span-2 flex justify-end pt-2">
                    <button
                      type="submit"
                      id="btnUpdateProfile"
                      class="w-full md:w-auto px-8 py-3 bg-blue-600 text-white rounded-xl text-sm font-semibold hover:bg-blue-700 transition shadow-lg shadow-blue-100 flex items-center justify-center gap-2"
                    >
                      <svg class="text-lg" data-icon="save" aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8"/><path d="M7 3v5h8"/></svg> Lưu thay đổi
                    </button>
                  </div>
                </form>
              </div>
            </div>

            <div
              class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden transition-all hover:shadow-md"
            >
              <div class="p-6 border-b border-gray-50 flex items-center gap-3">
                <svg class="text-2xl text-orange-600" data-icon="shield-quarter" aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M12 2v20"/></svg>
                <h2 class="text-lg font-semibold text-gray-700">
                  Bảo mật mật khẩu
                </h2>
              </div>
              <div class="p-6 bg-orange-50/20">
                <form id="changePasswordForm" class="space-y-6">
                  <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="flex flex-col gap-1.5">
                      <label
                        class="text-xs font-semibold text-gray-600 uppercase ml-1"
                        >Mật khẩu hiện tại</label
                      >
                      <div class="relative">
                        <input
                          type="password"
                          name="oldPassword"
                          placeholder="••••••••"
                          class="w-full h-11 px-4 pe-10 rounded-xl border border-gray-200 focus:ring-2 focus:ring-orange-500 outline-none text-sm transition-all shadow-sm"
                        />
                        <svg class="toggle-password absolute right-3 top-1/2 -translate-y-1/2 text-gray-600 cursor-pointer hover:text-orange-600 text-lg" data-icon="hide" aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M3 3l18 18"/><path d="M10.6 10.6A3 3 0 0 0 13.4 13.4"/><path d="M9.9 4.2A10.6 10.6 0 0 1 12 4c6.5 0 10 8 10 8a17.8 17.8 0 0 1-3.2 4.4"/><path d="M6.1 6.1C3.5 7.9 2 12 2 12s3.5 8 10 8a10.5 10.5 0 0 0 5.9-1.9"/></svg>
                      </div>
                      <span
                        class="error-msg text-red-500 text-[11px] ml-1 hidden"
                      ></span>
                    </div>

                    <div class="flex flex-col gap-1.5">
                      <label
                        class="text-xs font-semibold text-gray-600 uppercase ml-1"
                        >Mật khẩu mới</label
                      >
                      <div class="relative">
                        <input
                          type="password"
                          name="newPassword"
                          placeholder="Tối thiểu 6 ký tự"
                          class="w-full h-11 px-4 pe-10 rounded-xl border border-gray-200 focus:ring-2 focus:ring-orange-500 outline-none text-sm transition-all shadow-sm"
                        />
                        <svg class="toggle-password absolute right-3 top-1/2 -translate-y-1/2 text-gray-600 cursor-pointer hover:text-orange-600 text-lg" data-icon="hide" aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M3 3l18 18"/><path d="M10.6 10.6A3 3 0 0 0 13.4 13.4"/><path d="M9.9 4.2A10.6 10.6 0 0 1 12 4c6.5 0 10 8 10 8a17.8 17.8 0 0 1-3.2 4.4"/><path d="M6.1 6.1C3.5 7.9 2 12 2 12s3.5 8 10 8a10.5 10.5 0 0 0 5.9-1.9"/></svg>
                      </div>
                      <span
                        class="error-msg text-red-500 text-[11px] ml-1 hidden"
                      ></span>
                    </div>

                    <div class="flex flex-col gap-1.5">
                      <label
                        class="text-xs font-semibold text-gray-600 uppercase ml-1"
                        >Xác nhận mật khẩu</label
                      >
                      <div class="relative">
                        <input
                          type="password"
                          name="confirmPassword"
                          placeholder="Nhập lại mật khẩu mới"
                          class="w-full h-11 px-4 pe-10 rounded-xl border border-gray-200 focus:ring-2 focus:ring-orange-500 outline-none text-sm transition-all shadow-sm"
                        />
                        <svg class="toggle-password absolute right-3 top-1/2 -translate-y-1/2 text-gray-600 cursor-pointer hover:text-orange-600 text-lg" data-icon="hide" aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M3 3l18 18"/><path d="M10.6 10.6A3 3 0 0 0 13.4 13.4"/><path d="M9.9 4.2A10.6 10.6 0 0 1 12 4c6.5 0 10 8 10 8a17.8 17.8 0 0 1-3.2 4.4"/><path d="M6.1 6.1C3.5 7.9 2 12 2 12s3.5 8 10 8a10.5 10.5 0 0 0 5.9-1.9"/></svg>
                      </div>
                      <span
                        class="error-msg text-red-500 text-[11px] ml-1 hidden"
                      ></span>
                    </div>
                  </div>
                  <div class="flex justify-end">
                    <button
                      type="submit"
                      id="btnChangePass"
                      class="w-full md:w-auto px-8 py-3 bg-orange-600 text-white rounded-xl text-sm font-semibold hover:bg-orange-700 transition shadow-lg shadow-orange-100 flex items-center justify-center gap-2"
                    >
                      <svg class="text-lg" data-icon="lock-alt" aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg> Cập nhật mật khẩu
                    </button>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
      </main>
    </section>

    <script>
      window.addEventListener("load", function () {
        // HÀM HIỂN THỊ LỖI Ô INPUT (CHỈ THÊM LOGIC NÀY)
        function showInputError(inputName, message, formId) {
          const input = $(`${formId} input[name='${inputName}']`);
          input.addClass("border-red-500 focus:ring-red-500");
          const errorSpan = input.closest(".flex-col").find(".error-msg");
          errorSpan.text(message).removeClass("hidden");
        }

        // HÀM RESET LỖI
        function clearInputErrors(formId) {
          $(`${formId} input`).removeClass("border-red-500 focus:ring-red-500");
          $(`${formId} .error-msg`).addClass("hidden").text("");
        }

        // XỬ LÝ HIỂN THỊ MẬT KHẨU
        $(".toggle-password").on("click", function () {
          const input = $(this).siblings("input");
          if (input.attr("type") === "password") {
            input.attr("type", "text");
            this.dataset.icon = "show";
            this.innerHTML = '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>';
          } else {
            input.attr("type", "password");
            this.dataset.icon = "hide";
            this.innerHTML = '<path d="M3 3l18 18"/><path d="M10.6 10.6A3 3 0 0 0 13.4 13.4"/><path d="M9.9 4.2A10.6 10.6 0 0 1 12 4c6.5 0 10 8 10 8a17.8 17.8 0 0 1-3.2 4.4"/><path d="M6.1 6.1C3.5 7.9 2 12 2 12s3.5 8 10 8a10.5 10.5 0 0 0 5.9-1.9"/>';
          }
        });

        // 1. Xử lý cập nhật thông tin cá nhân
        $("#profileForm").on("submit", function (e) {
          e.preventDefault();

          // --- THÊM VALIDATE ---
          clearInputErrors("#profileForm");
          let isValid = true;
          const fullName = $("input[name='fullName']").val().trim();
          const email = $("input[name='email']").val().trim();
          const phone = $("input[name='phone']").val().trim();

          if (!fullName) {
            showInputError(
              "fullName",
              "Họ tên không được để trống",
              "#profileForm",
            );
            isValid = false;
          }
          if (!email) {
            showInputError(
              "email",
              "Email không được để trống",
              "#profileForm",
            );
            isValid = false;
          } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
            showInputError("email", "Email không hợp lệ", "#profileForm");
            isValid = false;
          }
          if (!phone) {
            showInputError(
              "phone",
              "Số điện thoại không được để trống",
              "#profileForm",
            );
            isValid = false;
          } else if (!/^(0|84)[0-9]{9}$/.test(phone)) {
            showInputError(
              "phone",
              "Số điện thoại không hợp lệ",
              "#profileForm",
            );
            isValid = false;
          }

          if (!isValid) return;
          // --------------------

          const btn = $("#btnUpdateProfile");
          btn
            .prop("disabled", true)
            .html('<svg class="animate-spin" data-icon="loader-alt" aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.2-8.6"/></svg> Đang lưu...');

          const formData = {
            fullName: fullName,
            email: email,
            phone: phone,
          };

          $.ajax({
            url: "/api/v1/user/update",
            method: "PUT",
            contentType: "application/json",
            data: JSON.stringify(formData),
            success: function (response) {
              Swal.fire({
                icon: "success",
                title: "Thành công",
                text: "Thông tin cá nhân đã được cập nhật!",
                timer: 1500,
                showConfirmButton: false,
              }).then(() => {
                location.reload();
              });
            },
            error: function (err) {
              Swal.fire(
                "Lỗi",
                err.responseJSON?.message || "Không thể cập nhật thông tin",
                "error",
              );
            },
            complete: function () {
              btn
                .prop("disabled", false)
                .html('<svg class="text-lg" data-icon="save" aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8"/><path d="M7 3v5h8"/></svg> Lưu thay đổi');
            },
          });
        });

        // 2. Xử lý đổi mật khẩu
        $("#changePasswordForm").on("submit", function (e) {
          e.preventDefault();

          // --- THÊM VALIDATE ---
          clearInputErrors("#changePasswordForm");
          let isValid = true;
          const oldPass = $("input[name='oldPassword']").val();
          const newPass = $("input[name='newPassword']").val();
          const confirmPass = $("input[name='confirmPassword']").val();

          if (!oldPass) {
            showInputError(
              "oldPassword",
              "Vui lòng nhập mật khẩu hiện tại",
              "#changePasswordForm",
            );
            isValid = false;
          }
          if (!newPass) {
            showInputError(
              "newPassword",
              "Vui lòng nhập mật khẩu mới",
              "#changePasswordForm",
            );
            isValid = false;
          } else if (newPass.length < 6) {
            showInputError(
              "newPassword",
              "Mật khẩu phải từ 6 ký tự",
              "#changePasswordForm",
            );
            isValid = false;
          }
          if (!confirmPass) {
            showInputError(
              "confirmPassword",
              "Vui lòng xác nhận mật khẩu",
              "#changePasswordForm",
            );
            isValid = false;
          } else if (newPass !== confirmPass) {
            showInputError(
              "confirmPassword",
              "Mật khẩu xác nhận không khớp",
              "#changePasswordForm",
            );
            isValid = false;
          }

          if (!isValid) return;
          // --------------------

          const btn = $("#btnChangePass");
          btn
            .prop("disabled", true)
            .html(
              '<svg class="animate-spin" data-icon="loader-alt" aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.2-8.6"/></svg> Đang xử lý...',
            );

          $.ajax({
            url: "/api/v1/user/change-pw",
            method: "PUT",
            contentType: "application/json",
            data: JSON.stringify({
              oldPassword: oldPass,
              newPassword: newPass,
            }),
            success: function () {
              Swal.fire({
                icon: "success",
                title: "Thành công",
                text: "Mật khẩu đã được thay đổi!",
              });
              $("#changePasswordForm")[0].reset();
            },
            error: function (err) {
              Swal.fire(
                "Lỗi",
                err.responseJSON?.message || "Mật khẩu hiện tại không đúng",
                "error",
              );
            },
            complete: function () {
              btn
                .prop("disabled", false)
                .html(
                  '<svg class="text-lg" data-icon="lock-alt" aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg> Cập nhật mật khẩu',
                );
            },
          });
        });
      });
    </script>
  </body>
</html>
