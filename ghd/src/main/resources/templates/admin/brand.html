<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{common/admin/header :: header(~{::title}, ~{::link})}">
  <title>Quản lý thương hiệu - Hệ thống quản trị</title>
</head>
<body class="bg-gray-50">
<div th:replace="common/admin/sidebar :: sidebar"></div>

<section id="content">
  <nav th:replace="common/admin/navbar :: navbar"></nav>

  <main class="p-6">
    <div class="max-w-full mx-auto">
      <div class="flex items-center justify-between mb-6">
        <h1 class="text-2xl font-semibold text-gray-700">
          Quản lý thương hiệu
        </h1>
        <button
                class="inline-flex items-center px-5 py-2.5 text-sm font-medium text-white bg-blue-600 rounded-xl shadow hover:bg-blue-700 transition-all active:scale-95"
                onclick="openModal()"
        >
          <svg class="me-2 text-lg" data-icon="plus" aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M12 5v14M5 12h14"/></svg>
          Thêm thương hiệu
        </button>
      </div>

      <div
              class="flex flex-col md:flex-row items-center justify-between gap-4 mb-6"
      >
        <div class="flex items-center gap-4 w-full md:w-auto">
          <form
                  id="searchForm"
                  class="relative flex items-center w-full md:w-[400px] h-10 rounded-xl bg-white border border-gray-200 focus-within:ring-2 focus-within:ring-blue-500 transition-all"
          >
            <input
                    id="searchInput"
                    type="search"
                    placeholder="Tìm kiếm thương hiệu..."
                    class="peer h-full w-full outline-none text-sm text-gray-700 bg-transparent ps-4"
            />
            <button
                    type="submit"
                    class="grid place-items-center h-full w-12 text-gray-600"
            >
              <svg class="text-xl" data-icon="search" aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
            </button>
          </form>
        </div>

        <div class="flex items-center gap-3 w-full md:w-auto">
          <select
                  id="pageSize"
                  class="h-10 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 outline-none px-3 bg-white cursor-pointer shadow-sm"
          >
            <option value="5" selected>5 bản ghi</option>
            <option value="10">10 bản ghi</option>
            <option value="25">25 bản ghi</option>
          </select>

          <div class="relative w-full md:w-56">
            <select
                    id="sortBrands"
                    class="block w-full h-10 ps-4 pe-10 text-sm text-gray-700 bg-white border border-gray-200 rounded-xl appearance-none focus:ring-2 focus:ring-blue-500 outline-none cursor-pointer shadow-sm"
            >
              <option value="id,desc">Mặc định (Mới nhất)</option>
              <option value="title,asc">Tên thương hiệu (A-Z)</option>
              <option value="title,desc">Tên thương hiệu (Z-A)</option>
            </select>
          </div>
        </div>
      </div>

      <div
              class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden"
      >
        <div class="overflow-x-auto">
          <table class="min-w-full">
            <thead class="bg-gray-50 border-b border-gray-100">
            <tr>
              <th
                      class="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase"
              >
                STT
              </th>
              <th
                      class="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase"
              >
                Logo
              </th>
              <th
                      class="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase"
              >
                Tên thương hiệu
              </th>
              <th
                      class="px-6 py-3 text-right text-xs font-semibold text-gray-600 uppercase"
              >
                Hành động
              </th>
            </tr>
            </thead>
            <tbody id="brandsBody" class="divide-y divide-gray-100"></tbody>
          </table>
        </div>

        <div
                id="pagination-container"
                class="px-6 py-4 border-t border-gray-100 bg-gray-50 flex flex-col md:flex-row items-center justify-between gap-4 hidden"
        >
              <span
                      id="page-info"
                      class="text-sm text-gray-600 font-medium"
              ></span>
          <div
                  id="pagination-buttons"
                  class="flex items-center gap-1"
          ></div>
        </div>
      </div>
    </div>

    <div
            id="brandModal"
            class="hidden fixed inset-0 bg-gray-900/50 backdrop-blur-sm flex items-center justify-center z-50"
    >
      <div
              class="bg-white p-6 rounded-xl w-full max-w-md shadow-2xl relative animate-in fade-in zoom-in duration-200"
      >
        <button
                type="button"
                class="absolute top-4 right-4 text-gray-600 hover:text-gray-600 text-2xl"
                onclick="closeModal()"
        >
          &times;
        </button>
        <h2
                id="modalTitle"
                class="text-xl font-semibold text-gray-700 mb-6"
        >
          Thông tin thương hiệu
        </h2>
        <form id="brandForm" class="space-y-5">
          <input type="hidden" id="brandId" />
          <div class="flex flex-col items-center mb-4">
            <div
                    id="logoWrapper"
                    class="relative group w-24 h-24 bg-gray-50 rounded-xl border-2 border-dashed border-gray-200 flex items-center justify-center overflow-constant"
            >
              <img
                      id="logoPreview"
                      src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"
                      class="w-full h-full object-cover"
              />
              <label
                      for="logoInput"
                      class="absolute inset-0 flex items-center justify-center bg-black/20 opacity-0 group-hover:opacity-100 cursor-pointer transition-all"
              >
                <svg class="text-white text-2xl" data-icon="camera" aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M14.5 4 13 6H8L6.5 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"/><circle cx="12" cy="13" r="4"/></svg>
              </label>
              <input
                      type="file"
                      id="logoInput"
                      accept="image/*"
                      class="hidden"
              />
            </div>
            <span class="text-xs text-gray-600 mt-2"
            >Tải lên Logo thương hiệu</span
            >
            <span
                    id="error-logo"
                    class="text-red-500 text-[11px] mt-1 hidden"
            ></span>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1"
            >Tên thương hiệu</label
            >
            <input
                    type="text"
                    id="title"
                    placeholder="Nhập tên thương hiệu..."
                    class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition"
            />
            <span
                    id="error-title"
                    class="text-red-500 text-xs mt-1 hidden"
            ></span>
          </div>
          <div class="flex gap-3 pt-2">
            <button
                    type="button"
                    onclick="closeModal()"
                    class="flex-1 px-4 py-2 bg-gray-100 text-gray-700 rounded-xl hover:bg-gray-200 transition font-medium"
            >
              Hủy bỏ
            </button>
            <button
                    type="submit"
                    id="btnSubmitBrand"
                    class="flex-1 px-4 py-2 bg-blue-600 text-white rounded-xl hover:bg-blue-700 transition font-medium"
            >
              Lưu thay đổi
            </button>
          </div>
        </form>
      </div>
    </div>
  </main>
</section>

<script th:src="@{/admin/js/main.js}"></script>

<script>
  const API_BASE = "/api/v1/brand";
  const EMPTY_IMG =
          "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7";
  let searchTimer;
  let currentPage = 1;

  window.addEventListener('load', function() {
    fetchBrands(1);
    $("#sortBrands, #pageSize").on("change", () => fetchBrands(1));
    $("#searchInput").on("input", function () {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => fetchBrands(1), 500);
    });
    $("#searchForm").on("submit", (e) => {
      e.preventDefault();
      fetchBrands(1);
    });

    // Xóa lỗi khi người dùng gõ
    $("#title").on("input", function () {
      $(this).removeClass("border-red-500");
      $("#error-title").addClass("hidden");
    });
  });

  function handleImageError(img) {
    let attempts = parseInt(img.getAttribute("data-retry") || "0");
    if (attempts < 5) {
      attempts++;
      img.setAttribute("data-retry", attempts);
      setTimeout(() => {
        const originalSrc = img.src.split("?")[0];
        img.src = `${originalSrc}?retry=${new Date().getTime()}`;
      }, 1000);
    } else {
      img.onerror = null;
      img.src = EMPTY_IMG;
      img.classList.add("bg-gray-100");
    }
  }

  function fetchBrands(page) {
    currentPage = page;
    const title = $("#searchInput").val();
    const [field, dir] = $("#sortBrands").val().split(",");
    const size = $("#pageSize").val();

    $.get(
            API_BASE,
            {
              title,
              sortField: field,
              sortDir: dir,
              pageNumber: page,
              pageSize: size,
            },
            function (response) {
              const data = response.body || response;
              renderTable(data.content || data, (page - 1) * size);
              renderPagination(
                      data.totalPages || 0,
                      page,
                      data.totalElements || 0,
              );
            },
    );
  }

  function renderTable(brands, startIdx) {
    const $tbody = $("#brandsBody").empty();
    if (!brands || brands.length === 0) {
      $tbody.append(
              `<tr><td colspan="4" class="px-6 py-12 text-center text-gray-600 italic">Không tìm thấy thương hiệu nào.</td></tr>`,
      );
      return;
    }

    const t = new Date().getTime();

    brands.forEach((brand, index) => {
      const imgPath =
              brand.logo && !brand.logo.includes("placeholder")
                      ? brand.logo
                      : null;

      let imageHtml = "";
      if (!imgPath) {
        imageHtml = `<div class="w-10 h-10 bg-gray-100 rounded border border-gray-200"></div>`;
      } else {
        imageHtml = `
              <picture>
                <source media="(min-width: 1024px)" srcset="${imgPath}_pc.webp?t=${t}">
                <img src="${imgPath}_mobile.webp?t=${t}"
                     onerror="handleImageError(this)"
                     class="w-10 h-10 object-contain rounded border border-gray-200 shadow-sm" loading="lazy">
              </picture>`;
      }

      $tbody.append(`
            <tr class="hover:bg-blue-50/30 transition border-b border-gray-50 last:border-0">
                <td class="px-6 py-4 text-sm text-gray-600">${startIdx + index + 1}</td>
                <td class="px-6 py-4">${imageHtml}</td>
                <td class="px-6 py-4 text-sm font-semibold text-gray-700">${brand.title}</td>
                <td class="px-6 py-4 text-right space-x-3">
                    <button type="button" onclick="editBrand('${brand.id}')" class="p-2 text-blue-600 hover:bg-blue-50 rounded-xl transition cursor-pointer" title="Sửa thương hiệu"><svg class="text-xl" data-icon="edit-alt" aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>
                    <button type="button" onclick="deleteBrand('${brand.id}')" class="p-2 text-rose-600 hover:bg-rose-50 rounded-xl transition cursor-pointer" title="Xóa thương hiệu"><svg class="text-xl" data-icon="trash" aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v5M14 11v5"/></svg></button>
                </td>
            </tr>
          `);
    });
  }

  function renderPagination(totalPages, activePage, totalElements) {
    const $container = $("#pagination-container");
    const $buttons = $("#pagination-buttons").empty();
    if (totalPages <= 1) {
      $container.addClass("hidden");
      return;
    }
    $container.removeClass("hidden");
    $("#page-info").text(`Tổng số ${totalElements} bản ghi`);

    for (let i = 1; i <= totalPages; i++) {
      if (
              i === 1 ||
              i === totalPages ||
              (i >= activePage - 2 && i <= activePage + 2)
      ) {
        const btn = $(
                `<button class="w-9 h-9 rounded-xl text-sm font-medium transition-all ${i === activePage ? "bg-blue-600 text-white" : "bg-white border"}">${i}</button>`,
        );
        btn.on("click", () => fetchBrands(i));
        $buttons.append(btn);
      }
    }
  }

  function openModal() {
    clearErrors();
    $("#brandModal").removeClass("hidden");
    $("#modalTitle").text("Thêm thương hiệu mới");
  }

  function closeModal() {
    $("#brandModal").addClass("hidden");
    $("#brandForm")[0].reset();
    $("#brandId").val("");
    $("#logoWrapper picture").remove();
    if ($("#logoPreview").length === 0) {
      $("#logoWrapper").prepend(
              `<img id="logoPreview" src="${EMPTY_IMG}" class="w-full h-full object-contain" />`,
      );
    } else {
      $("#logoPreview").attr("src", EMPTY_IMG);
    }
    clearErrors();
  }

  function editBrand(id) {
    $.get(`${API_BASE}/${id}`, function (response) {
      const brand = response.body || response;
      $("#modalTitle").text("Cập nhật thương hiệu");
      $("#brandId").val(brand.id);
      $("#title").val(brand.title);

      const imgPath =
              brand.logo && !brand.logo.includes("placeholder")
                      ? brand.logo
                      : null;
      const $wrapper = $("#logoWrapper");
      const t = new Date().getTime();

      $wrapper.find("picture, #logoPreview").remove();
      if (imgPath) {
        $wrapper.prepend(`
              <picture>
                <source media="(min-width: 1024px)" srcset="${imgPath}_pc.webp?t=${t}">
                <img id="logoPreview" src="${imgPath}_mobile.webp?t=${t}" onerror="handleImageError(this)" class="w-full h-full object-cover">
              </picture>`);
      } else {
        $wrapper.prepend(
                `<img id="logoPreview" src="${EMPTY_IMG}" class="w-full h-full object-cover" />`,
        );
      }
      $("#brandModal").removeClass("hidden");
    });
  }

  // --- HÀM VALIDATE PHÍA CLIENT ---
  function validateClient() {
    clearErrors();
    let isValid = true;
    const title = $("#title").val().trim();
    const logoFile = $("#logoInput")[0].files[0];

    // Validate tiêu đề (khớp @NotBlank và @NotNull của Bean)
    if (!title) {
      $("#error-title")
              .text("Vui lòng nhập tên thương hiệu")
              .removeClass("hidden");
      $("#title").addClass("border-red-500");
      isValid = false;
    } else if (title.length < 2) {
      $("#error-title")
              .text("Tên thương hiệu quá ngắn")
              .removeClass("hidden");
      $("#title").addClass("border-red-500");
      isValid = false;
    }

    // Validate logo (nếu có chọn file)
    if (logoFile) {
      const validExtensions = [
        "image/jpeg",
        "image/jpg",
        "image/png",
        "image/webp",
      ];
      if (!validExtensions.includes(logoFile.type)) {
        $("#error-logo")
                .text("Định dạng ảnh không hỗ trợ (Chỉ JPG, PNG, WEBP)")
                .removeClass("hidden");
        isValid = false;
      } else if (logoFile.size > 2 * 1024 * 1024) {
        // 2MB
        $("#error-logo")
                .text("Dung lượng ảnh không được vượt quá 2MB")
                .removeClass("hidden");
        isValid = false;
      }
    }

    return isValid;
  }

  $("#brandForm").on("submit", function (e) {
    e.preventDefault();

    // 1. CHẠY VALIDATE TRƯỚC
    if (!validateClient()) return;

    const id = $("#brandId").val();
    const formData = new FormData();
    formData.append("title", $("#title").val().trim());
    const file = $("#logoInput")[0].files[0];
    if (file) formData.append("logo", file);

    const $btn = $("#btnSubmitBrand");
    $btn
            .prop("disabled", true)
            .addClass("opacity-50")
            .text("Đang xử lý...");

    $.ajax({
      url: id ? `${API_BASE}/${id}` : API_BASE,
      method: id ? "PUT" : "POST",
      data: formData,
      processData: false,
      contentType: false,
      success: function () {
        closeModal();
        setTimeout(() => fetchBrands(currentPage), 400);
        Toast.fire({
          icon: "success",
          title: id ? "Đã cập nhật!" : "Đã tạo mới!",
        });
      },
      error: function (xhr) {
        if (xhr.status === 400 && xhr.responseJSON.data) {
          const errors = xhr.responseJSON.data;
          Object.keys(errors).forEach((key) => {
            $(`#error-${key}`).text(errors[key]).removeClass("hidden");
            if (key === "title") $("#title").addClass("border-red-500");
          });
        } else {
          Toast.fire({ icon: "error", title: "Có lỗi xảy ra!" });
        }
      },
      complete: function () {
        $btn
                .prop("disabled", false)
                .removeClass("opacity-50")
                .text("Lưu thay đổi");
      },
    });
  });

  function deleteBrand(id) {
    Swal.fire({
      title: "Xóa thương hiệu?",
      text: "Hành động này không thể hoàn tác!",
      icon: "warning",
      showCancelButton: true,
      confirmButtonColor: "#ef4444",
      confirmButtonText: "Đồng ý xóa",
      cancelButtonText: "Hủy bỏ",
    }).then((result) => {
      if (result.isConfirmed) {
        $.ajax({
          url: `${API_BASE}/${id}`,
          method: "DELETE",
          success: () => {
            Toast.fire({ icon: "success", title: "Đã xóa thành công." });
            fetchBrands(currentPage);
          },
        });
      }
    });
  }

  function clearErrors() {
    $('[id^="error-"]').addClass("hidden").text("");
    $("#title").removeClass("border-red-500");
  }

  $("#logoInput").on("change", function (e) {
    const file = e.target.files[0];
    if (file) {
      // Xóa thông báo lỗi logo khi chọn lại
      $("#error-logo").addClass("hidden");

      const reader = new FileReader();
      reader.onload = (e) => {
        $("#logoWrapper picture").remove();
        if ($("#logoPreview").length === 0)
          $("#logoWrapper").prepend(
                  '<img id="logoPreview" class="w-full h-full object-cover" />',
          );
        $("#logoPreview").attr("src", e.target.result);
      };
      reader.readAsDataURL(file);
    }
  });
</script>
</body>
</html>
