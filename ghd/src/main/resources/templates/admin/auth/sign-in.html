<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head
    th:replace="~{common/head :: common_head('Đăng nhập', ~{:: #login-resources}, null, null)}"
  >
    <th:block id="login-resources"> </th:block>
  </head>
  <body class="bg-gray-200 flex items-center justify-center min-h-screen p-4">
    <div
      class="bg-white w-full max-w-md rounded-3xl shadow-2xl overflow-hidden border border-gray-100"
    >
      <div class="p-8 text-center">
        <img
          th:src="@{/admin/images/logo.png}"
          alt="Logo"
          class="mx-auto"
          style="max-height: 50px"
        />
      </div>
      <div class="p-8">
        <form id="loginForm" class="space-y-6">
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2"
              >Tên đăng nhập</label
            >
            <div class="relative group">
              <div
                class="absolute inset-y-0 left-0 pl-4 flex items-center text-gray-600 group-focus-within:text-blue-600"
              >
                <svg class="" data-icon="user" aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="7" r="4"/></svg>
              </div>
              <input
                type="text"
                id="username"
                name="username"
                required
                class="w-full pl-11 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition-all"
                placeholder="Nhập tài khoản"
              />
            </div>
          </div>

          <div>
            <div class="flex justify-between items-center mb-2">
              <label class="text-sm font-semibold text-gray-700"
                >Mật khẩu</label
              >
            </div>
            <div class="relative group">
              <div
                class="absolute inset-y-0 left-0 pl-4 flex items-center text-gray-600 group-focus-within:text-blue-600"
              >
                <svg class="" data-icon="lock" aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
              </div>
              <input
                type="password"
                id="passwordField"
                name="password"
                required
                class="w-full pl-11 pr-12 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition-all"
                placeholder="••••••••"
              />
              <button
                type="button"
                onclick="togglePassword()"
                class="absolute inset-y-0 right-0 pr-4 text-gray-600 cursor-pointer"
              >
                <svg class="" data-icon="eye" aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="passwordIcon"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>

          <button
            type="submit"
            id="btnLogin"
            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3.5 rounded-xl transition-all"
          >
            ĐĂNG NHẬP
          </button>
        </form>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.26.17"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script>
      const Toast = Swal.mixin({
        toast: true,
        position: "top-end",
        showConfirmButton: false,
        timer: 3000,
        timerProgressBar: true,
      });

      function togglePassword() {
        const field = document.getElementById("passwordField");
        const icon = document.getElementById("passwordIcon");

        if (field.type === "password") {
          field.type = "text";
          icon.dataset.icon = "hide";
          icon.innerHTML =
                  '<path d="M3 3l18 18"/><path d="M10.6 10.6A3 3 0 0 0 13.4 13.4"/><path d="M9.9 4.2A10.6 10.6 0 0 1 12 4c6.5 0 10 8 10 8a17.8 17.8 0 0 1-3.2 4.4"/><path d="M6.1 6.1C3.5 7.9 2 12 2 12s3.5 8 10 8a10.5 10.5 0 0 0 5.9-1.9"/>';
        } else {
          field.type = "password";
          icon.dataset.icon = "eye";
          icon.innerHTML =
                  '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>';
        }
      }

      window.addEventListener("load", function () {
        $("#loginForm").on("submit", function (e) {
          e.preventDefault();

          const username = $("#username").val().trim();
          const password = $("#passwordField").val().trim();

          if (!username || password.length < 6) {
            Toast.fire({
              icon: "error",
              title: "Thông tin đăng nhập không đúng!",
            });
            return;
          }

          const btn = $("#btnLogin");

          btn
                  .prop("disabled", true)
                  .html(
                          '<svg class="animate-spin inline-block mr-2" data-icon="loader-alt" aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.2-8.6"/></svg> Đang xử lý...'
                  );

          $.ajax({
            url: "/api/v1/auth/login",
            method: "POST",
            contentType: "application/json",
            dataType: "json",
            data: JSON.stringify({ username, password }),
            timeout: 15000,

            success: function (response) {
              Toast.fire({
                icon: "success",
                title: "Đăng nhập thành công!",
              });

              setTimeout(function () {
                window.location.assign("/admin/v1/");
              }, 800);
            },

            error: function (xhr, textStatus) {
              btn.prop("disabled", false).text("ĐĂNG NHẬP");

              let msg = "Sai tài khoản hoặc mật khẩu";

              if (textStatus === "timeout") {
                msg = "Kết nối quá lâu, vui lòng thử lại";
              } else if (xhr.responseJSON?.message) {
                msg = xhr.responseJSON.message;
              }

              Toast.fire({
                icon: "error",
                title: msg,
              });
            },
          });
        });
      });
    </script>
  </body>
</html>
