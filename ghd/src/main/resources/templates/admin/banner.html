<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{common/admin/header :: header(~{::title}, ~{::link})}">
    <title>Quản lý Banner - Green Home Shop</title>
  </head>
  <body class="bg-gray-50 text-gray-700">
    <div th:replace="common/admin/sidebar :: sidebar"></div>
    <section id="content">
      <nav th:replace="common/admin/navbar :: navbar"></nav>
      <main class="p-6">
        <div class="max-w-full mx-auto">
          <div
            class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8"
          >
            <div>
              <h1 class="text-2xl font-semibold text-gray-700">
                Quản lý Banner
              </h1>
              <p class="text-sm text-gray-600 mt-1">
                Cấu hình biểu ngữ quảng cáo và chương trình khuyến mãi
              </p>
            </div>
            <button
              type="button"
              onclick="openAddModal()"
              class="flex items-center justify-center gap-2 px-5 py-2.5 bg-blue-600 text-white rounded-xl font-semibold shadow-lg shadow-blue-200 hover:bg-blue-700 hover:-translate-y-0.5 transition-all cursor-pointer"
            >
              <svg class="text-xl" data-icon="plus-circle" aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
              Thêm Banner Mới
            </button>
          </div>

          <div
            class="flex flex-col md:flex-row items-center justify-between gap-4 mb-6 bg-white p-4 rounded-2xl border border-gray-100 shadow-sm"
          >
            <div class="flex items-center gap-4 w-full md:w-auto">
              <div class="relative flex-1 w-full md:w-80">
                <span class="absolute inset-y-0 left-0 flex items-center ps-3 pointer-events-none"
                >
                  <svg class="text-gray-600 text-xl" data-icon="search" aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
                </span>
                <input
                  id="searchInput"
                  type="text"
                  placeholder="Tìm kiếm tiêu đề banner..."
                  class="w-full pl-10 pr-4 py-2 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 outline-none transition"
                />
              </div>
            </div>
            <p class="text-sm font-medium text-gray-600" id="stat-count">
              Đang tải...
            </p>
          </div>

          <div
            class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden"
          >
            <div class="overflow-x-auto">
              <table class="min-w-full">
                <thead class="bg-gray-50 border-b border-gray-100">
                  <tr>
                    <th
                      class="px-6 py-4 text-left text-xs font-semibold text-gray-600 uppercase tracking-widest"
                    >
                      Xem trước (WebP)
                    </th>
                    <th
                      class="px-6 py-4 text-left text-xs font-semibold text-gray-600 uppercase tracking-widest"
                    >
                      Thông tin Banner
                    </th>
                    <th
                      class="px-6 py-4 text-center text-xs font-semibold text-gray-600 uppercase tracking-widest"
                    >
                      Vị trí
                    </th>
                    <th
                      class="px-6 py-4 text-center text-xs font-semibold text-gray-600 uppercase tracking-widest"
                    >
                      Thời hạn
                    </th>
                    <th
                      class="px-6 py-4 text-center text-xs font-semibold text-gray-600 uppercase tracking-widest"
                    >
                      Trạng thái
                    </th>
                    <th
                      class="px-6 py-4 text-right text-xs font-semibold text-gray-600 uppercase tracking-widest"
                    >
                      Thao tác
                    </th>
                  </tr>
                </thead>
                <tbody id="bannerBody" class="divide-y divide-gray-50"></tbody>
              </table>
            </div>
            <div
              id="pagination-container"
              class="px-6 py-4 border-t border-gray-100 bg-gray-50 flex flex-col md:flex-row items-center justify-between gap-4 hidden"
            >
              <span
                id="page-info"
                class="text-sm text-gray-600 font-medium"
              ></span>
              <div
                id="pagination-buttons"
                class="flex items-center gap-1"
              ></div>
            </div>
          </div>
        </div>

        <div
          id="bannerModal"
          class="hidden fixed inset-0 bg-gray-900/60 backdrop-blur-sm flex items-center justify-center z-[9999] p-4"
        >
          <div
            class="bg-white p-8 rounded-3xl w-full max-w-3xl shadow-2xl relative animate-fade-in overflow-y-auto max-h-[95vh]"
          >
            <button
              type="button"
              class="absolute top-6 right-6 text-gray-600 hover:text-rose-500 text-3xl transition cursor-pointer"
              onclick="closeModal()"
            >
              <svg class="" data-icon="x" aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M18 6 6 18M6 6l12 12"/></svg>
            </button>

            <h2
              id="modalTitle"
              class="text-2xl font-semibold text-gray-700 mb-8 flex items-center gap-3"
            >
              <svg class="text-blue-600 p-2 bg-blue-50 rounded-xl" data-icon="image-add" aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M15 9v6M12 12h6"/><path d="m3 17 5-5 4 4"/></svg>
              Thêm Banner Mới
            </h2>

            <form id="bannerForm" class="space-y-6">
              <input type="hidden" id="bannerId" />
              <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="space-y-4">
                  <div>
                    <label
                      class="block text-sm font-semibold text-gray-700 mb-2"
                      >Tiêu đề Banner
                      <span class="text-rose-500">*</span></label
                    >
                    <input
                      type="text"
                      id="title"
                      name="title"
                      required
                      class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-500"
                    />
                  </div>
                  <div>
                    <label
                      class="block text-sm font-semibold text-gray-700 mb-2"
                      >Đường dẫn liên kết (Link)</label
                    >
                    <input
                      type="text"
                      id="linkUrl"
                      name="linkUrl"
                      class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-500"
                      placeholder="https://..."
                    />
                  </div>
                  <div>
                    <label
                      class="block text-sm font-semibold text-gray-700 mb-2"
                      >Vị trí hiển thị</label
                    >
                    <input
                      type="text"
                      id="position"
                      name="position"
                      class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-500"
                      placeholder="Ví dụ: HOME_TOP, SIDEBAR"
                    />
                  </div>
                </div>

                <div>
                  <label class="block text-sm font-semibold text-gray-700 mb-2"
                    >Hình ảnh Banner <span class="text-rose-500">*</span></label
                  >
                  <div
                    class="relative group w-full h-[200px] rounded-2xl border-2 border-dashed border-gray-200 bg-gray-50 flex flex-col items-center justify-center overflow-hidden transition hover:border-blue-400"
                  >
                    <img
                      id="imagePreview"
                      src=""
                      class="hidden w-full h-full object-cover"
                    />
                    <div id="uploadPlaceholder" class="text-center p-4">
                      <svg class="text-4xl text-gray-300" data-icon="cloud-upload" aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M16 16l-4-4-4 4"/><path d="M12 12v9"/><path d="M20.4 17.6A5 5 0 0 0 18 8.1 7 7 0 0 0 4.7 10.3 4.5 4.5 0 0 0 5.5 19H8"/></svg>
                      <p
                        class="text-[10px] font-semibold text-gray-600 mt-2 uppercase"
                      >
                        Click chọn ảnh (Hệ thống tự resize WebP)
                      </p>
                    </div>
                    <input
                      type="file"
                      id="imageFile"
                      name="imageFile"
                      accept="image/*"
                      class="absolute inset-0 opacity-0 cursor-pointer"
                    />
                  </div>
                </div>
              </div>

              <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                  <label class="block text-sm font-semibold text-gray-700 mb-2"
                    >Ngày bắt đầu</label
                  >
                  <input
                    type="datetime-local"
                    id="startDate"
                    name="startDate"
                    class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-500"
                  />
                </div>
                <div>
                  <label class="block text-sm font-semibold text-gray-700 mb-2"
                    >Ngày kết thúc</label
                  >
                  <input
                    type="datetime-local"
                    id="endDate"
                    name="endDate"
                    class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-500"
                  />
                </div>
                <div>
                  <label class="block text-sm font-semibold text-gray-700 mb-2"
                    >Trạng thái kích hoạt</label
                  >
                  <select
                    id="isActive"
                    name="isActive"
                    class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-500 font-semibold"
                  >
                    <option value="1">Đang hoạt động</option>
                    <option value="0">Tạm ngưng</option>
                  </select>
                </div>
              </div>

              <div class="flex gap-4 pt-4 border-t">
                <button
                  type="button"
                  onclick="closeModal()"
                  class="flex-1 py-3 bg-gray-100 text-gray-600 rounded-xl font-semibold cursor-pointer"
                >
                  Hủy bỏ
                </button>
                <button
                  type="submit"
                  class="flex-1 py-3 bg-blue-600 text-white rounded-xl font-semibold shadow-lg shadow-blue-200"
                >
                  Lưu Banner
                </button>
              </div>
            </form>
          </div>
        </div>
      </main>
    </section>

    <script th:inline="javascript">
      const API_BASE = "/api/v1/banner";
      const EMPTY_IMG =
        "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7";
      let searchTimer;
      let currentPage = 1;

      window.addEventListener("load", function () {
        fetchBanners(1);
        $("#searchInput").on("input", function () {
          clearTimeout(searchTimer);
          searchTimer = setTimeout(() => fetchBanners(1), 500);
        });
      });

      // Hàm xử lý lỗi ảnh - Tự động thử lại khi Server đang xử lý Async Resize
      function handleImageError(img) {
        let attempts = parseInt(img.getAttribute("data-retry") || "0");
        if (attempts < 5) {
          attempts++;
          img.setAttribute("data-retry", attempts);
          setTimeout(() => {
            const originalSrc = img.src.split("?")[0];
            img.src = `${originalSrc}?retry=${new Date().getTime()}`;
          }, 1000);
        } else {
          img.onerror = null;
          img.src = EMPTY_IMG;
          img.parentElement.classList.add("bg-gray-100");
        }
      }

      function fetchBanners(page) {
        currentPage = page;
        const params = {
          title: $("#searchInput").val(),
          pageNumber: page - 1,
          pageSize: 10,
        };

        $.get(API_BASE, params, function (response) {
          const data = response.body || response;
          renderTable(data.content || []);
          renderPagination(data.totalPages, page, data.totalElements);
          $("#stat-count").text(`Tổng cộng: ${data.totalElements} banner`);
        });
      }

      function renderTable(banners) {
        const $tbody = $("#bannerBody").empty();
        const t = new Date().getTime();

        if (banners.length === 0) {
          $tbody.append(
            `<tr><td colspan="6" class="px-6 py-12 text-center text-gray-600 italic">Không tìm thấy banner nào.</td></tr>`,
          );
          return;
        }

        banners.forEach((item) => {
          const statusBadge =
            item.isActive === 1
              ? `<span class="px-2.5 py-1 bg-emerald-100 text-emerald-700 rounded-full text-[10px] font-semibold uppercase">Hoạt động</span>`
              : `<span class="px-2.5 py-1 bg-rose-100 text-rose-700 rounded-full text-[10px] font-semibold uppercase">Tạm khóa</span>`;

          // Xử lý đường dẫn WebP
          const baseImg = item.imageUrl
            ? item.imageUrl.replace(/\.[^/.]+$/, "")
            : null;
          let imageHtml = "";

          if (!baseImg) {
            imageHtml = `<div class="w-full h-full flex items-center justify-center bg-gray-100"><svg class="text-gray-300 text-xl" data-icon="image" aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10.5" r="1.5"/><path d="m21 15-5-5L5 19"/></svg></div>`;
          } else {
            imageHtml = `
              <picture class="w-full h-full">
                <source media="(min-width: 1024px)" srcset="${baseImg}_pc.webp?t=${t}">
                <source media="(min-width: 640px)" srcset="${baseImg}_tablet.webp?t=${t}">
                <img src="${baseImg}_sm.webp?t=${t}"
                     onerror="handleImageError(this)"
                     class="w-full h-full object-cover"
                     loading="lazy">
              </picture>`;
          }

          $tbody.append(`
            <tr class="hover:bg-blue-50/20 transition">
              <td class="px-6 py-4">
                <div class="w-32 h-16 rounded-lg overflow-hidden border border-gray-100 shadow-sm bg-gray-50 flex">
                  ${imageHtml}
                </div>
              </td>
              <td class="px-6 py-4">
                <div class="text-sm font-semibold text-gray-700">${item.title}</div>
                <div class="text-[10px] text-gray-600 mt-1 line-clamp-1">${item.linkUrl || "Không có liên kết"}</div>
              </td>
              <td class="px-6 py-4 text-center">
                <span class="px-2 py-1 bg-gray-100 rounded text-[10px] font-semibold text-gray-600">${item.position || "N/A"}</span>
              </td>
              <td class="px-6 py-4 text-center">
                <div class="text-[10px] text-gray-600">Từ: ${formatDate(item.startDate)}</div>
                <div class="text-[10px] text-gray-600">Đến: ${formatDate(item.endDate)}</div>
              </td>
              <td class="px-6 py-4 text-center">${statusBadge}</td>
              <td class="px-6 py-4 text-right space-x-1">
                <button onclick="openEditModal('${item.id}')" class="p-2 text-blue-600 hover:bg-blue-50 rounded-lg transition cursor-pointer"><svg class="text-lg" data-icon="edit-alt" aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>
                <button onclick="deleteBanner('${item.id}')" class="p-2 text-rose-600 hover:bg-rose-50 rounded-lg transition cursor-pointer"><svg class="text-lg" data-icon="trash" aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v5M14 11v5"/></svg></button>
              </td>
            </tr>
          `);
        });
      }

      function formatDate(dateStr) {
        if (!dateStr) return "Không giới hạn";
        const date = new Date(dateStr);
        return (
          date.toLocaleDateString("vi-VN") +
          " " +
          date.toLocaleTimeString("vi-VN", {
            hour: "2-digit",
            minute: "2-digit",
          })
        );
      }

      window.openAddModal = function () {
        $("#modalTitle").text("Thêm Banner Mới");
        $("#bannerId").val("");
        $("#bannerForm")[0].reset();
        $("#imagePreview").addClass("hidden");
        $("#uploadPlaceholder").removeClass("hidden");
        $("#bannerModal").removeClass("hidden").addClass("flex");
      };

      window.closeModal = function () {
        $("#bannerModal").addClass("hidden").removeClass("flex");
      };

      window.openEditModal = function (id) {
        $.get(`${API_BASE}/${id}`, function (response) {
          const data = response.body || response;
          $("#bannerId").val(data.id);
          $("#title").val(data.title);
          $("#linkUrl").val(data.linkUrl);
          $("#position").val(data.position);
          $("#isActive").val(data.isActive);
          $("#startDate").val(
            data.startDate ? data.startDate.substring(0, 16) : "",
          );
          $("#endDate").val(data.endDate ? data.endDate.substring(0, 16) : "");

          if (data.imageUrl) {
            const previewUrl =
              data.imageUrl.replace(/\.[^/.]+$/, "") + "_tablet.webp";
            $("#imagePreview").attr("src", previewUrl).removeClass("hidden");
            $("#uploadPlaceholder").addClass("hidden");
          }
          $("#bannerModal").removeClass("hidden").addClass("flex");
        });
      };

      $("#bannerForm").on("submit", function (e) {
        e.preventDefault();
        const id = $("#bannerId").val();
        $.ajax({
          url: id ? `${API_BASE}/${id}` : API_BASE,
          type: id ? "PUT" : "POST",
          data: new FormData(this),
          processData: false,
          contentType: false,
          success: function () {
            closeModal();
            fetchBanners(currentPage);
            Toast.fire({ icon: "success", title: "Lưu thành công!" });
          },
          error: function () {
            Toast.fire({ icon: "error", title: "Lỗi hệ thống!" });
          },
        });
      });

      window.deleteBanner = function (id) {
        Swal.fire({
          title: "Xác nhận xóa?",
          text: "Banner sẽ được chuyển vào thùng rác!",
          icon: "warning",
          showCancelButton: true,
          confirmButtonColor: "#ef4444",
          confirmButtonText: "Xóa ngay",
        }).then((result) => {
          if (result.isConfirmed) {
            $.ajax({
              url: `${API_BASE}/${id}`,
              type: "DELETE",
              success: function () {
                fetchBanners(currentPage);
                Toast.fire({ icon: "success", title: "Đã xóa banner!" });
              },
            });
          }
        });
      };

      $("#imageFile").on("change", function () {
        if (this.files && this.files[0]) {
          const reader = new FileReader();
          reader.onload = (e) => {
            $("#imagePreview")
              .attr("src", e.target.result)
              .removeClass("hidden");
            $("#uploadPlaceholder").addClass("hidden");
          };
          reader.readAsDataURL(this.files[0]);
        }
      });

      function renderPagination(totalPages, activePage, totalElements) {
        const $container = $("#pagination-container");
        const $buttons = $("#pagination-buttons").empty();
        if (totalPages <= 1) {
          $container.addClass("hidden");
          return;
        }
        $container.removeClass("hidden");
        $("#page-info").text(`Tổng ${totalElements} banner`);

        $buttons.append(
          createPageBtn(
            '<svg class="" data-icon="chevron-left" aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="m15 18-6-6 6-6"/></svg>',
            activePage - 1,
            activePage === 1,
          ),
        );
        for (let i = 1; i <= totalPages; i++) {
          if (
            i === 1 ||
            i === totalPages ||
            (i >= activePage - 1 && i <= activePage + 1)
          ) {
            $buttons.append(createPageBtn(i, i, false, i === activePage));
          }
        }
        $buttons.append(
          createPageBtn(
            '<svg class="" data-icon="chevron-right" aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="m9 18 6-6-6-6"/></svg>',
            activePage + 1,
            activePage === totalPages,
          ),
        );
      }

      function createPageBtn(label, page, disabled, isActive = false) {
        const btn = $(
          `<button class="w-8 h-8 flex items-center justify-center rounded-lg text-xs font-medium transition ${isActive ? "bg-blue-600 text-white" : "bg-white text-gray-600 border border-gray-200 hover:bg-gray-50"} ${disabled ? "opacity-30 pointer-events-none" : "cursor-pointer"}">${label}</button>`,
        );
        if (!disabled && !isActive) btn.on("click", () => fetchBanners(page));
        return btn;
      }
    </script>
  </body>
</html>
