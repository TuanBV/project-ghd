<section xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml" id="sidebar"
         th:fragment="sidebar">
    <a th:href="@{/}" class="brand flex items-center justify-center" aria-label="Green Home Shop">
        <picture>
            <source
                    type="image/webp"
                    th:srcset="@{/admin/images/greenhome-logo-500.lossless.webp}"
            />

            <img
                    th:src="@{/admin/images/logo.png}"
                    alt="Logo Green Home Shop"
                    class="mx-auto h-auto w-[180px] object-contain"
                    width="180"
                    height="39"
                    loading="eager"
                    fetchpriority="high"
                    decoding="async"
            />
        </picture>
    </a>
    <ul class="side-menu top">
        <li th:class="${activePage == 'dashboard' ? 'active' : ''}">
            <a href="/admin/v1/">
                <svg class="" data-icon="dashboard" aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor" ><path d="M3 3h8v10H3zM13 3h8v6h-8zM13 11h8v10h-8zM3 15h8v6H3z"/></svg>
                <span class="text">Dashboard</span>
            </a>
        </li>
        <li th:class="${activePage == 'user' ? 'active' : ''}" sec:authorize="hasRole('ADMIN')">
            <a href="/admin/v1/user">
                <svg class="" data-icon="user" aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor" ><path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="7" r="4"/></svg>
                <span class="text">User</span>
            </a>
        </li>
        <li th:class="${activePage == 'category' ? 'active' : ''}">
            <a href="/admin/v1/category">
                <svg class="" data-icon="category" aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor" ><path d="M3 3h8v8H3zM13 3h8v8h-8zM3 13h8v8H3zM13 13h8v8h-8z"/></svg>
                <span class="text">Danh mục</span>
            </a>
        </li>
        <li th:class="${activePage == 'brand' ? 'active' : ''}">
            <a href="/admin/v1/brand">
                <svg class="" data-icon="purchase-tag" aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor" ><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8zM7.5 8.5a1 1 0 1 0 0-2 1 1 0 0 0 0 2z"/></svg>
                <span class="text">Thương hiệu</span>
            </a>
        </li>
        <li th:class="${activePage == 'product' ? 'active' : ''}">
            <a href="/admin/v1/product">
                <svg class="" data-icon="package" aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor" ><path d="m21 8-9-5-9 5 9 5 9-5z"/><path d="M3 10v6l9 5 9-5v-6l-9 5z"/></svg>
                <span class="text">Sản phẩm</span>
            </a>
        </li>
        <li th:class="${activePage == 'slide' ? 'active' : ''}">
            <a href="/admin/v1/slider">
                <svg class="" data-icon="slideshow" aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor" ><path d="M3 5h18v14H3z"/><path d="m10 9 6 3-6 3z" fill="#fff"/></svg>
                <span class="text">Slider</span>
            </a>
        </li>
        <li th:class="${activePage == 'banner' ? 'active' : ''}">
            <a href="/admin/v1/banner">
                <svg class="" data-icon="image" aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor" ><path d="M3 5h18v14H3zM8.5 12a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3zm12.5 5-5-5-4 4-2-2-5 5h16z"/></svg>
                <span class="text">Banner</span>
            </a>
        </li>
        <li th:class="${activePage == 'news' ? 'active' : ''}">
            <a href="/admin/v1/news">
                <svg class="" data-icon="news" aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor" ><path d="M4 5h16v14H4zM7 9h10v2H7zm0 4h10v2H7z"/></svg>
                <span class="text">Tin tức</span>
            </a>
        </li>
        <li th:class="${activePage == 'policy' ? 'active' : ''}">
            <a href="/admin/v1/policy">
                <svg class="" data-icon="shield-quarter" aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M12 2v20"/></svg>
                <span class="text">Chính sách</span>
            </a>
        </li>
        <li th:class="${activePage == 'order' ? 'active' : ''}"  sec:authorize="hasRole('ADMIN')">
            <a href="/admin/v1/order">
                <svg class="" data-icon="cart" aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor" ><path d="M1 1h4l2.7 13.4A2 2 0 0 0 9.7 16h8.8a2 2 0 0 0 2-1.6L22 6H6"/><circle cx="9" cy="21" r="2"/><circle cx="20" cy="21" r="2"/></svg>
                <span class="text">Đơn hàng</span>
            </a>
        </li>
        <li th:class="${activePage == 'contact' ? 'active' : ''}"  sec:authorize="hasRole('ADMIN')">
            <a href="/admin/v1/contact">
                <svg class="" data-icon="envelope" aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor" ><path d="M4 5h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2zm8 8 8-5H4l8 5z"/></svg>
                <span class="text">Liên hệ</span>
            </a>
        </li>
    </ul>
    <ul class="side-menu bottom">
        <li>
            <a href="/admin/v1/settings">
                <svg class="" data-icon="cog" aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor" ><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-2.8 1.2V21h-4v-.2a1.7 1.7 0 0 0-2.8-1.2l-.1.1-2.8-2.8.1-.1A1.7 1.7 0 0 0 3.2 14H3v-4h.2a1.7 1.7 0 0 0 1.2-2.8l-.1-.1 2.8-2.8.1.1A1.7 1.7 0 0 0 10 3.2V3h4v.2a1.7 1.7 0 0 0 2.8 1.2l.1-.1 2.8 2.8-.1.1A1.7 1.7 0 0 0 20.8 10h.2v4h-.2a1.7 1.7 0 0 0-1.4 1zM12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/></svg>
                <span class="text">Cài đặt</span>
            </a>
        </li>
        <li>
            <a href="javascript:void(0)" class="logout" id="btnLogout">
                <svg class="" data-icon="power-off" aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M12 2v10"/><path d="M18.4 6.6a9 9 0 1 1-12.8 0"/></svg>
                <span class="text">Đăng xuất</span>
            </a>
        </li>
    </ul>

    <script>
        window.addEventListener('load', function() {
            // Handle logout event
            $("#btnLogout").on("click", function (e) {
                e.preventDefault();
                const token = localStorage.getItem("accessToken");
                $.ajax({
                    url: "/api/v1/auth/logout",
                    method: "DELETE",
                    headers: {
                        Authorization: "Bearer " + token,
                    },
                    success: function (response) {
                        Toast.fire({ icon: "success", title: "Đăng xuất thành công!" });
                    },
                    error: function (xhr) {
                        Toast.fire({ icon: "error", title: "Đăng xuất thất bại!" });
                    },
                    complete: function () {
                        // Clear local storage and redirect to home
                        localStorage.removeItem("accessToken");
                        setTimeout(function () {
                            window.location.href = "/";
                        }, 1000);
                    },
                });
            });
        });
    </script>
</section>
