<nav
  th:fragment="breadcrumb(items)"
  class="flex text-sm"
  aria-label="Breadcrumb"
>
  <ol class="inline-flex items-center space-x-1 md:space-x-3 list-none p-0">
    <li class="inline-flex items-center">
      <a
        th:href="@{/}"
        class="text-gray-600 hover:text-blue-900 transition flex items-center"
      >
        <svg class="mr-2" data-icon="home" aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor" ><path d="m3 11 9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg> Trang chủ
      </a>
    </li>

    <th:block th:each="item, iterStat : ${items}">
      <li class="flex items-center">
        <span class="text-gray-600 mx-2">/</span>

        <span
          th:if="${iterStat.last}"
          class="text-blue-700 font-semibold"
          th:text="${item.name}"
          >Về chúng tôi</span
        >

        <a
          th:if="${!iterStat.last}"
          th:href="@{${item.url}}"
          class="text-gray-600 hover:text-blue-900 transition"
          th:text="${item.name}"
          >Danh mục</a
        >
      </li>
    </th:block>
  </ol>
</nav>
