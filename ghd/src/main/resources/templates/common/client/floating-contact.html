<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <style>
      /* 1. Hiệu ứng nhấp nhô cho PC */
      @keyframes gentle-wobble {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-8px);
        }
      }
      .animate-wobble {
        animation: gentle-wobble 4s ease-in-out infinite;
      }
      .delay-1 {
        animation-delay: 0.5s;
      }
      .delay-2 {
        animation-delay: 1s;
      }

      /* 2. Hiệu ứng ánh kim chạy ngang (Shimmer) */
      @keyframes shimmer {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(100%);
        }
      }
      .animate-shimmer {
        animation: shimmer 2.5s infinite;
      }

      /* 3. Tối ưu Safe Area cho iPhone đời mới */
      .pb-safe {
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
    </style>
  </head>
  <body>
    <div th:fragment="floating-contact">
      <div
        class="fixed bottom-10 left-8 flex flex-col gap-5 z-[99] hidden lg:flex"
      >
        <a
          href="https://www.messenger.com/t/191032857437399"
          target="_blank"
          class="group animate-wobble relative flex items-center justify-center w-14 h-14 bg-white rounded-full shadow-xl border border-gray-100 transition-all duration-300 hover:scale-110"
        >
          <img
            width="32"
            height="32"
            th:src="@{/common/images/facebook-messenger.svg}"
            alt="Messenger"
            class="w-8 h-8"
          />
          <span
            class="absolute left-full ml-4 px-3 py-1.5 bg-gray-900 text-white text-xs font-medium rounded-lg opacity-0 group-hover:opacity-100 whitespace-nowrap pointer-events-none transition-all duration-300 translate-x-2 group-hover:translate-x-0 shadow-2xl"
          >
            Chat qua Facebook
          </span>
        </a>
        <a
          th:href="'https://zalo.me/' + ${sysParams['consulting_hotline']}"
          target="_blank"
          class="group animate-wobble delay-1 relative flex items-center justify-center w-14 h-14 bg-white rounded-full shadow-xl border border-gray-100 transition-all duration-300 hover:scale-110"
        >
          <img
            width="32"
            height="32"
            th:src="@{/common/images/zalo.svg}"
            class="w-8 h-8"
            alt="Nhắn tin qua Zalo"
          />
          <span
            class="absolute left-full ml-4 px-3 py-1.5 bg-gray-900 text-white text-xs font-medium rounded-lg opacity-0 group-hover:opacity-100 whitespace-nowrap pointer-events-none transition-all duration-300 translate-x-2 group-hover:translate-x-0 shadow-2xl"
          >
            Chat qua Zalo
          </span>
        </a>
        <a
          th:href="'tel:'+${sysParams['hotline']}"
          class="group animate-wobble delay-2 relative flex items-center bg-gradient-to-r from-blue-600 via-blue-700 to-indigo-800 text-white pl-1.5 pr-6 py-1.5 rounded-full shadow-[0_15px_30px_-5px_rgba(37,99,235,0.4)] transition-all duration-500 hover:shadow-[0_20px_40px_-5px_rgba(37,99,235,0.6)] hover:-translate-y-1 active:scale-95 border border-white/10 overflow-hidden"
        >
          <div class="relative flex items-center justify-center w-12 h-12">
            <span
              class="absolute inline-flex h-full w-full rounded-full bg-blue-400 opacity-40 animate-ping"
            ></span>
            <div
              class="relative bg-white text-blue-700 rounded-full w-10 h-10 flex items-center justify-center shadow-inner transition-transform duration-700 group-hover:rotate-[360deg]"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="currentColor"
              >
                <path
                  d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72 12.84 12.84 0 00.7 2.81 2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45 12.84 12.84 0 002.81.7A2 2 0 0122 16.92z"
                ></path>
              </svg>
            </div>
          </div>
          <div class="ml-3 flex flex-col">
            <div class="flex items-center space-x-1 mb-0.5">
              <span
                class="w-1.5 h-1.5 bg-emerald-400 rounded-full animate-pulse"
              ></span>
              <span
                class="text-[9px] font-semibold uppercase tracking-widest text-blue-100/80"
                >Gọi ngay</span
              >
            </div>
            <span
              class="text-base font-semibold tracking-widest leading-none"
              th:text="${sysParams['hotline']}"
            >
              0852 262 666
            </span>
          </div>
          <div
            class="absolute inset-0 rounded-full bg-gradient-to-r from-transparent via-white/20 to-transparent -translate-x-full group-hover:animate-shimmer pointer-events-none"
          ></div>
        </a>
      </div>
      <div
        class="fixed bottom-0 left-0 right-0 z-[998] lg:hidden bg-white/95 backdrop-blur-xl border-t border-gray-200/60 shadow-[0_-10px_40px_rgba(0,0,0,0.1)] pb-safe"
      >
        <div class="flex items-end justify-around h-16 py-2">
          <a
            th:href="'tel:' + ${sysParams['hotline']}"
            class="flex flex-col items-center justify-center flex-1 group border-r border-gray-100"
          >
            <div
              class="relative w-6 h-6 flex items-center justify-center mb-1 transition-transform group-active:scale-90"
            >
              <div
                class="w-6 h-6 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center border border-blue-100 shadow-sm"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="currentColor"
                >
                  <path
                    d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72 12.84 12.84 0 00.7 2.81 2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45 12.84 12.84 0 002.81.7A2 2 0 0122 16.92z"
                  ></path>
                </svg>
              </div>
            </div>
            <span class="text-[10px] font-semibold text-gray-600 uppercase"
              >Gọi ngay</span
            >
          </a>

          <a
            th:href="'https://zalo.me/' + ${sysParams['zalo']}"
            class="flex flex-col items-center justify-center flex-1 group border-r border-gray-100"
          >
            <div class="mb-1 transition-transform group-active:scale-90">
              <img
                width="auto"
                height="auto"
                th:src="@{/common/images/zalo.svg}"
                alt="Nhắn tin qua Zalo"
                class="w-6 h-6"
              />
            </div>
            <span class="text-[10px] font-semibold text-gray-600 uppercase"
              >Zalo</span
            >
          </a>

          <a
            href="https://m.me/191032857437399"
            class="flex flex-col items-center justify-center flex-1 group border-r border-gray-100"
          >
            <div class="mb-1 transition-transform group-active:scale-90">
              <img
                width="auto"
                height="auto"
                th:src="@{/common/images/facebook-messenger.svg}"
                alt="Messenger"
                class="w-6 h-6"
              />
            </div>
            <span class="text-[10px] font-semibold text-gray-600 uppercase"
              >Tin nhắn</span
            >
          </a>

          <div
            role="button"
            tabindex="0"
            onclick="toggleSidebar()"
            class="flex flex-col items-center justify-center flex-1 group cursor-pointer"
          >
            <div
              class="w-8 h-8 flex items-center justify-center mb-1 transition-transform group-active:scale-90"
            >
              <svg class="text-3xl text-gray-700" data-icon="menu" aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M4 6h16M4 12h16M4 18h16"/></svg>
            </div>
            <span class="text-[10px] font-semibold text-gray-600 uppercase"
              >Danh mục</span
            >
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
