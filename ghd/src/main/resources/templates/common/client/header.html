<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <style>
      svg[data-icon] {
        display: inline-block;
        width: 1em;
        height: 1em;
        vertical-align: -0.125em;
        flex-shrink: 0;
        line-height: 1;
      }

      button svg[data-icon],
      a svg[data-icon],
      [role="button"] svg[data-icon],
      .flex > svg[data-icon],
      .inline-flex > svg[data-icon] {
        align-self: center;
      }

      .scrollbar-hide::-webkit-scrollbar {
        display: none;
      }
      .scrollbar-hide {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      /* Thêm vào thẻ style của bạn */
      #suggestionList::-webkit-scrollbar {
        width: 4px;
      }
      #suggestionList::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 10px;
      }
      .line-clamp-2 {
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      #header {
        min-height: 118px;
      }

      #searchContainer {
        position: relative;
        height: 46px;
        min-height: 46px;
      }

      #searchInputHeader {
        height: 46px;
        min-height: 46px;
      }

      #searchSuggestions {
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
      }

      main {
        padding-top: 140px;
      }

      @media (min-width: 768px) {
        #header {
          min-height: 160px;
        }

        main {
          padding-top: 200px;
        }
      }

      @media (min-width: 1024px) {
        #header {
          min-height: 112px;
        }

        main {
          padding-top: 140px;
        }
      }

      .category-nav {
        height: 48px;
        min-height: 48px;
        overflow: hidden;
      }

      @media (max-width: 767px) {
        .category-nav {
          display: none !important;
          height: 0;
          min-height: 0;
        }
      }

      @media (min-width: 768px) {
        .category-nav {
          display: flex;
        }
      }

    </style>
  </head>
  <body>
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-57RQW6K3"
                    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->

    <section id="header" th:fragment="header" class="fixed top-0 left-0 right-0 w-full z-[1000] min-h-[118px] md:min-h-[160px] lg:min-h-[112px]">
      <div
        id="sidebarOverlay"
        class="fixed inset-0 bg-black/60 z-[60] hidden opacity-0 transition-opacity duration-300 cursor-pointer"
        onclick="toggleSidebar()"
        aria-label="Đóng menu"
      ></div>

      <button
        id="scrollToTopBtn"
        class="fixed bottom-20 lg:bottom-10 right-10 z-[998] hidden border border-gray-200 w-14 h-14 flex items-center justify-center p-3 rounded-full shadow-xl transition-all duration-300 focus:outline-none cursor-pointer bg-white hover:bg-gray-50"
      >
        <svg class="-rotate-90" data-icon="chevron-right" aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="m9 18 6-6-6-6"/></svg>
      </button>

      <header class="bg-white shadow-sm sticky top-0 z-50">
        <div
          class="container mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-y-3"
        >
          <div
            role="button"
            tabindex="0"
            class="flex items-center md:hidden cursor-pointer"
            onclick="toggleSidebar()"
            aria-label="Đóng menu"
          >
            <svg class="text-3xl text-gray-700" data-icon="menu" aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M4 6h16M4 12h16M4 18h16"/></svg>
          </div>

          <div class="flex items-center">
            <a th:href="@{/}" class="flex items-center" aria-label="Green Home Shop">
              <picture>
                <source
                        type="image/webp"
                        th:srcset="@{/client/images/greenhome-logo-500.lossless.webp}"
                />

                <img
                        th:src="@{/client/images/logo.png}"
                        alt="Logo Green Home Shop"
                        class="w-[180px] md:w-[200px] h-auto object-contain"
                        width="200"
                        height="43"
                        fetchpriority="high"
                        loading="eager"
                        decoding="async"
                />
              </picture>
            </a>
          </div>

          <div
            class="order-3 w-full lg:order-2 lg:flex-1 lg:max-w-2xl lg:mx-10"
          >
            <div class="relative h-[46px] min-h-[46px]" id="searchContainer">
              <input
                  id="searchInputHeader"
                  type="text"
                  placeholder="Tìm kiếm sản phẩm..."
                  autocomplete="off"
                  class="w-full h-[46px] min-h-[46px] border border-gray-200 rounded-full px-6 pr-12 focus:outline-none focus:ring-2 focus:ring-blue-500 text-base md:text-sm transition-all bg-gray-50"
              />
              <div
                id="searchSuggestions"
                class="absolute left-0 right-0 top-full mt-2 bg-white border border-gray-200 rounded-xl shadow-xl z-[1001] hidden overflow-hidden"
              >
                <div
                  id="suggestionList"
                  class="max-h-[400px] overflow-y-auto"
                ></div>
              </div>

              <button
                onclick="handleSearch()"
                aria-label="Tìm kiếm sản phẩm"
                class="absolute right-1.5 top-1/2 -translate-y-1/2 bg-blue-600 hover:bg-blue-700 text-white p-2 rounded-full w-9 h-9 flex items-center justify-center shadow-sm transition-colors cursor-pointer"
              >
                <svg class="" data-icon="search" aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
              </button>
            </div>
          </div>

          <div class="order-2 lg:order-3 flex items-center space-x-4">
            <a
              aria-label="Xem giỏ hàng của bạn"
              href="/gio-hang"
              class="flex items-center gap-2 md:gap-3 bg-white border border-gray-100 md:bg-blue-600 md:hover:bg-blue-700 md:text-white p-1 md:pr-4 md:pl-1 rounded-full transition-all shadow-sm md:shadow-md active:scale-95 group"
            >
              <div
                class="relative bg-blue-600 text-white p-2.5 rounded-full flex items-center justify-center w-10 h-10 shadow-sm"
              >
                <svg class="text-xl" data-icon="cart" aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h8.8a2 2 0 0 0 2-1.6L22 6H6"/></svg>
                <span
                  id="cart-count"
                  class="absolute -top-1 -right-1 bg-red-500 text-white text-[10px] min-w-[18px] h-[18px] flex items-center justify-center rounded-full border-2 border-white font-semibold hidden"
                  >0</span
                >
              </div>
              <div
                class="hidden md:flex flex-col items-start leading-tight pr-1"
              >
                <span
                      class="text-[11px] uppercase font-semibold tracking-tight text-gray-700 md:text-white md:opacity-80"
                >
                  Giỏ hàng
                </span>
                <span
                  id="cart-total"
                  class="text-[13px] font-semibold whitespace-nowrap"
                  >0 VND</span
                >
              </div>
            </a>
          </div>
        </div>

        <div class="category-nav bg-[#e6effd] text-gray-700 border-t border-gray-100 hidden md:flex items-center h-[48px] min-h-[48px] overflow-hidden">
          <div class="container mx-auto px-4 flex items-center h-[48px]">
            <div
              class="flex items-center h-[48px] px-5 cursor-pointer hover:bg-blue-100 transition-colors"
              onclick="toggleSidebar()"
              aria-label="Đóng menu"
            >
              <svg class="mr-3 text-gray-700 text-2xl" data-icon="menu" aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M4 6h16M4 12h16M4 18h16"/></svg>
              <span
                class="font-semibold uppercase text-xs md:text-sm tracking-wide leading-none"
                >Danh mục sản phẩm</span
              >
            </div>
            <div
              class="flex flex-1 items-center h-full overflow-x-auto whitespace-nowrap scrollbar-hide text-xs md:text-sm ml-4 font-medium"
            >
              <th:block th:each="cat, iter : ${navBarData}">
                <a
                  th:href="@{/san-pham(danh-muc=${cat.slug})}"
                  class="px-4 h-[48px] flex items-center leading-none text-gray-600 hover:text-blue-900"
                  th:text="${cat.title}"
                  >Category</a
                >
              </th:block>
            </div>
          </div>
        </div>
      </header>

      <div
        id="sidebar"
        class="fixed top-0 bottom-0 left-[-310px] w-[310px] bg-white shadow-2xl h-screen z-[999] flex flex-col transition-all duration-300"
      >
        <div
          class="p-4 flex items-center justify-between border-b border-gray-50"
        >
            <a th:href="@{/}" aria-label="GreenHome" class="h-10 flex items-center">
              <picture>
                <source
                        type="image/webp"
                        th:srcset="@{/client/images/greenhome-logo-500.lossless.webp}"
                />

                <img
                        th:src="@{/client/images/logo.png}"
                        alt="Logo Green Home Shop"
                        class="w-[180px] md:w-[200px] h-auto object-contain"
                        width="200"
                        height="43"
                        fetchpriority="high"
                        loading="eager"
                        decoding="async"
                />
              </picture>
            </a>
          <button
            class="p-2 text-gray-700 cursor-pointer"
            onclick="toggleSidebar()"
            aria-label="Đóng menu"
          >
            <svg class="text-2xl" data-icon="x" aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
        </div>

        <div class="flex-1 overflow-y-auto py-2 px-2">
          <a
            href="/"
            class="flex items-center p-3 rounded-xl text-gray-700 hover:bg-blue-50 transition-all mb-1 font-medium"
          >
            <svg class="w-8 text-xl" data-icon="home-alt" aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>
            <span>Trang chủ</span>
          </a>
          <a
            href="/san-pham"
            class="flex items-center p-3 rounded-xl text-gray-700 hover:bg-blue-50 transition-all mb-1 font-medium"
          >
            <svg class="w-8 text-xl" data-icon="package" aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor" ><path d="m21 8-9-5-9 5 9 5 9-5z"/><path d="M3 10v6l9 5 9-5v-6l-9 5z"/></svg>
            <span>Sản phẩm</span>
          </a>
          <a
            href="/tin-tuc"
            class="flex items-center p-3 rounded-xl text-gray-700 hover:bg-blue-50 transition-all mb-1 font-medium"
          >
            <svg class="w-8 text-xl" data-icon="news" aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M4 5h14a2 2 0 0 1 2 2v12H6a2 2 0 0 1-2-2z"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>
            <span>Tin tức</span>
          </a>

          <div class="my-2 px-3">
            <p
              class="text-xs font-semibold text-gray-600 uppercase tracking-widest"
            >
              Danh mục sản phẩm
            </p>
          </div>

          <div th:each="cat, catStat : ${navBarData}" class="mb-1">
            <div
              class="flex items-center justify-between rounded-xl hover:bg-blue-50 transition-all overflow-hidden"
            >
              <a
                th:href="@{/san-pham(danh-muc=${cat.slug})}"
                class="flex items-center flex-1 p-3 min-w-0"
              >
                <svg class="w-7 flex-shrink-0 text-gray-600" data-icon="chevron-right" aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="m9 18 6-6-6-6"/></svg>
                <span
                  class="font-medium text-gray-700 truncate"
                  th:text="${cat.title}"
                  >Danh mục</span
                >
              </a>

              <div
                th:if="${not #lists.isEmpty(cat.childs)}"
                class="p-4 cursor-pointer text-gray-600 flex-shrink-0"
                th:onclick="toggleSubmenu(event, 'sub-cat-' + [[${catStat.index}]], 'arr-cat-' + [[${catStat.index}]])"
              >
                <svg class="text-xs transition-transform duration-200" data-icon="plus" aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" th:id="'arr-cat-' + ${catStat.index}"><path d="M12 5v14M5 12h14"/></svg>
              </div>
            </div>

            <div
              th:id="'sub-cat-' + ${catStat.index}"
              class="hidden bg-gray-50 rounded-xl mt-1 mx-1 border-l-2 border-blue-200 overflow-hidden"
            >
              <a
                th:each="brand : ${cat.childs}"
                th:href="@{/san-pham(danh-muc=${cat.slug}, thuong-hieu=${brand.slug})}"
                class="block p-3 pl-10 text-sm text-gray-600 hover:text-blue-900 hover:bg-white transition-all border-b border-gray-50 last:border-0 truncate"
              >
                <span th:text="${brand.title}">Brand Name</span>
              </a>
            </div>
          </div>
        </div>
      </div>

      <script th:inline="javascript">
        // 1. Khai báo các Selector dùng chung để tránh truy vấn DOM nhiều lần
        const sidebar = document.getElementById("sidebar");
        const overlay = document.getElementById("sidebarOverlay");
        const searchInput = document.getElementById("searchInputHeader");
        const suggestionBox = document.getElementById("searchSuggestions");
        const suggestionList = document.getElementById("suggestionList");
        const scrollBtn = document.getElementById("scrollToTopBtn");

        // 2. Sidebar & Submenu
        function toggleSidebar() {
          if (!sidebar || !overlay) return;
          const isOpen = sidebar.classList.contains("left-0");

          sidebar.classList.toggle("left-0", !isOpen);
          sidebar.classList.toggle("left-[-310px]", isOpen);

          if (!isOpen) {
            overlay.classList.remove("hidden");
            setTimeout(
              () => overlay.classList.replace("opacity-0", "opacity-100"),
              10,
            );
            document.body.style.overflow = "hidden";
          } else {
            overlay.classList.replace("opacity-100", "opacity-0");
            setTimeout(() => overlay.classList.add("hidden"), 300);
            document.body.style.overflow = "";
          }
        }

        function toggleSubmenu(event, menuId, arrowId) {
          event?.preventDefault();
          event?.stopPropagation();
          const menu = document.getElementById(menuId);
          const arrow = document.getElementById(arrowId);
          if (!menu) return;

          const isHidden = menu.classList.toggle("hidden");
          if (arrow) {
            arrow.dataset.icon = isHidden ? "plus" : "minus";
            arrow.innerHTML = isHidden
              ? '<path d="M12 5v14M5 12h14"/>'
              : '<path d="M5 12h14"/>';
          }
        }

        // 3. Giỏ hàng
        function updateCartBadge() {
          const cart = JSON.parse(localStorage.getItem("cart")) || [];
          const totalItems = cart.reduce(
            (sum, item) => sum + (Number(item.quantity) || 0),
            0,
          );
          const totalPrice = cart.reduce((sum, item) => {
            const price =
              parseFloat(
                String(item.salePrice || item.price).replace(/[^0-9.-]+/g, ""),
              ) || 0;
            return sum + price * (Number(item.quantity) || 0);
          }, 0);

          const countBadge = document.getElementById("cart-count");
          if (countBadge) {
            countBadge.innerText = totalItems;
            countBadge.classList.toggle("hidden", totalItems <= 0);
          }

          const totalText = document.getElementById("cart-total");
          if (totalText) {
            totalText.innerText =
              new Intl.NumberFormat("vi-VN").format(totalPrice) + " VND";
          }
        }

        // 4. Tìm kiếm & Gợi ý
        function handleSearch() {
          const keyword = searchInput?.value.trim();
          if (keyword) {
            window.location.href =
              "/san-pham?ten=" + encodeURIComponent(keyword);
          }
        }

        let debounceTimer;
        let suggestionAbortController;
        let suggestionRequestId = 0;
        if (searchInput) {
          searchInput.addEventListener("input", function () {
            const keyword = this.value.trim();
            clearTimeout(debounceTimer);
            if (suggestionAbortController) {
              suggestionAbortController.abort();
            }
            if (keyword.length < 2)
              return suggestionBox.classList.add("hidden");

            debounceTimer = setTimeout(() => {
              const requestId = ++suggestionRequestId;
              suggestionAbortController = new AbortController();
              fetch(
                `/api/v1/product/search-suggestions?ten=${encodeURIComponent(keyword)}`,
                { signal: suggestionAbortController.signal },
              )
                .then((res) => res.json())
                .then((data) => {
                  if (requestId !== suggestionRequestId) return;
                  if (!data?.length)
                    return suggestionBox.classList.add("hidden");

                  const whitePlaceholder =
                    "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+ip1FSAAAAAElFTkSuQmCC";

                  suggestionList.innerHTML = data
                    .map((p) => {
                      const displayPrice = p.salePrice || p.price;
                      const formattedPrice =
                        displayPrice > 0
                          ? new Intl.NumberFormat("vi-VN").format(
                              displayPrice,
                            ) + " VND"
                          : "Liên hệ";

                      const imageUrl = p.image
                        ? `${p.image}_mobile.webp`
                        : whitePlaceholder;

                      return `
                            <a href="/san-pham/${p.slug}" class="flex items-center gap-3 p-3 hover:bg-gray-50 transition-colors border-b border-gray-50 last:border-0 group">
                                <div class="w-14 h-14 flex-shrink-0 bg-white rounded-lg overflow-hidden border border-gray-100 flex items-center justify-center">
                                    <img src="https://images.weserv.nl/?url=https://greenhomeshop.vn${imageUrl}&w=120&output=webp&q=80"
                                         class="w-full h-full object-contain group-hover:scale-110 transition-transform duration-300"
                                         alt="${p.title}"
                                         width="56"
                                         height="56"
                                         loading="lazy"
                                         decoding="async"
                                         onerror="this.src='${whitePlaceholder}'">
                                </div>
                                <div class="flex flex-col flex-1 min-w-0">
                                    <span class="text-xs md:text-sm font-semibold text-gray-800 leading-snug line-clamp-2 group-hover:text-blue-600 transition-colors">
                                        ${p.title}
                                    </span>
                                    <div class="flex items-end gap-2 mt-0.5">
                                        <span class="text-xs md:text-sm font-semibold text-red-600">
                                            ${formattedPrice}
                                        </span>
                                        ${
                                          p.salePrice && p.salePrice < p.price
                                            ? `
                                            <span class="text-[10px] md:text-xs text-[#191919] line-through">
                                                ${new Intl.NumberFormat("vi-VN").format(p.price)} VND
                                            </span>
                                        `
                                            : ""
                                        }
                                    </div>
                                </div>
                            </a>`;
                    })
                    .join("");
                  suggestionBox.classList.remove("hidden");
                })
                .catch((error) => {
                  if (error.name !== "AbortError") {
                    suggestionBox.classList.add("hidden");
                  }
                });
            }, 300);
          });

          searchInput.addEventListener(
            "keypress",
            (e) => e.key === "Enter" && handleSearch(),
          );
        }

        // 5. Global Listener for Add to Cart
        document.addEventListener("click", function (event) {
          const btn = event.target.closest(".btn-add-to-cart");
          if (!btn) return;

          event.preventDefault();
          const product = {
            productId: btn.getAttribute("data-id"),
            title: btn.getAttribute("data-title"),
            price: parseFloat(btn.getAttribute("data-price")) || 0,
            image: btn.getAttribute("data-image"),
            slug: btn.getAttribute("data-slug"),
            category: btn.getAttribute("data-category"),
            quantity: 1,
          };

          let cart = JSON.parse(localStorage.getItem("cart")) || [];
          // Ép kiểu ID về String để so sánh chính xác
          const existingItem = cart.find(
            (item) =>
              String(item.productId) ===
              String(product.productId),
          );

          if (existingItem) {
            existingItem.quantity += 1;
          } else {
            cart.push(product);
          }

          localStorage.setItem("cart", JSON.stringify(cart));

          // Phát sự kiện để Header nhận biết (dùng cho các file JS bên ngoài)
          window.dispatchEvent(new Event("cartUpdated"));

          window.showToast({
            icon: "success",
            title: "Đã thêm " + product.title + " vào giỏ hàng!",
          });
        });

        document.addEventListener("DOMContentLoaded", () => {
          updateCartBadge();

          // Scroll to Top
          let scrollTicking = false;
          window.addEventListener("scroll", () => {
            if (!scrollBtn || scrollTicking) return;
            scrollTicking = true;
            window.requestAnimationFrame(() => {
              scrollBtn.classList.toggle("hidden", window.scrollY <= 300);
              scrollTicking = false;
            });
          }, { passive: true });
          if (scrollBtn)
            scrollBtn.onclick = () =>
              window.scrollTo({ top: 0, behavior: "smooth" });
        });

        // Đóng gợi ý & Sidebar khi click ngoài
        document.addEventListener("click", (e) => {
          if (
            suggestionBox &&
            !document.getElementById("searchContainer").contains(e.target)
          ) {
            suggestionBox.classList.add("hidden");
          }
        });

        window.addEventListener("storage", updateCartBadge);
        window.addEventListener("cartUpdated", updateCartBadge);
      </script>
    </section>
  </body>
</html>
