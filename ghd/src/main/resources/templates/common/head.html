  <script>
    window.dataLayer = window.dataLayer || [];
    window.gtag = window.gtag || function(){ window.dataLayer.push(arguments); };
    window.__loadScriptOnce = window.__loadScriptOnce || {};
    window.loadScriptOnce = window.loadScriptOnce || function(src) {
      if (window.__loadScriptOnce[src]) return window.__loadScriptOnce[src];
      window.__loadScriptOnce[src] = new Promise(function(resolve, reject) {
        var existing = document.querySelector('script[src="' + src + '"]');
        if (existing && existing.dataset.loaded === "true") return resolve();
        if (existing) {
          existing.addEventListener("load", resolve, { once: true });
          existing.addEventListener("error", reject, { once: true });
          return;
        }
        var script = document.createElement("script");
        script.src = src;
        script.async = true;
        script.defer = true;
        script.onload = function() {
          script.dataset.loaded = "true";
          resolve();
        };
        script.onerror = reject;
        document.head.appendChild(script);
      });
      return window.__loadScriptOnce[src];
    };
    window.ensureJQuery = window.ensureJQuery || function() {
      return window.jQuery
        ? Promise.resolve(window.jQuery)
        : window.loadScriptOnce("https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js").then(function() {
            return window.jQuery;
          });
    };
    window.ensureSwal = window.ensureSwal || function() {
      return window.Swal
        ? Promise.resolve(window.Swal)
        : window.loadScriptOnce("https://cdn.jsdelivr.net/npm/sweetalert2@11.26.17").then(function() {
            return window.Swal;
          });
    };
    window.getToast = window.getToast || function() {
      return window.ensureSwal().then(function(Swal) {
        if (!window.Toast) {
          window.Toast = Swal.mixin({
            toast: true,
            position: "top-end",
            width: "350px",
            showConfirmButton: false,
            timer: 3000,
            timerProgressBar: true,
            customClass: {
              title: "text-sm! text-gray-700!",
            },
            didOpen: function(toast) {
              toast.addEventListener("mouseenter", Swal.stopTimer);
              toast.addEventListener("mouseleave", Swal.resumeTimer);
            },
          });
        }
        return window.Toast;
      });
    };
    window.showToast = window.showToast || function(options) {
      return window.getToast().then(function(Toast) {
        return Toast.fire(options);
      });
    };
    window.addEventListener("load", function() {
      var loadGtm = function() {
        if (window.__gtmLoaded) return;
        window.__gtmLoaded = true;
        window.dataLayer.push({ "gtm.start": new Date().getTime(), event: "gtm.js" });
        window.loadScriptOnce("https://www.googletagmanager.com/gtm.js?id=GTM-57RQW6K3");
      };
      if ("requestIdleCallback" in window) {
        window.requestIdleCallback(loadGtm, { timeout: 3000 });
      } else {
        window.setTimeout(loadGtm, 2500);
      }
    });
  </script>

    svg[data-icon] {
      display: inline-block;
      width: 1em;
      height: 1em;
      vertical-align: -0.125em;
      flex-shrink: 0;
      line-height: 1;
    }

    button svg[data-icon],
    a svg[data-icon],
    [role="button"] svg[data-icon],
    .flex > svg[data-icon],
    .inline-flex > svg[data-icon] {
      align-self: center;
    }

    [x-cloak] {
      display: none !important;
    }

    #header {
      min-height: 118px;
    }

    .category-nav {
      display: none;
      height: 48px;
      min-height: 48px;
      overflow: hidden;
    }

body {

        "MiSans-Web",
        system-ui,
        -apple-system,
        sans-serif;
    }

    main {
      padding-top: 140px;
    }

    @media (min-width: 768px) and (max-width: 1023px) {
      #header {
        min-height: 160px;
      }

      .category-nav {
        display: flex;
      }

      main {
        padding-top: 200px;
      }
    }

    @media (min-width: 1024px) {
      #header {
        min-height: 112px;
      }

      .category-nav {
        display: flex;
      }
    }

    button,
    a {
      cursor: pointer;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      border: 0;
    }
