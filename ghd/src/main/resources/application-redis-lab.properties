# Redis Failure & Cache Test Lab - chỉ load khi profile "redis-lab" được kích hoạt
# (SPRING_PROFILES_ACTIVE=redis-lab hoặc -Dspring.profiles.active=redis-lab).
# Không đụng application.properties gốc - profile này CHỈ cộng thêm cấu hình, không
# override bất kỳ giá trị production nào. Xem REDIS_TEST_GUIDE.md để biết cách bật.

app.redis-lab.enabled=true

# Namespace riêng cho toàn bộ key do lab tạo ra (penetration/avalanche/stampede/lock),
# tách biệt hoàn toàn khỏi cache "products" thật (app.cache.namespace) để không bao giờ
# đụng TTL/behavior của cache production khi thử nghiệm.
app.redis-lab.namespace=${app.cache.namespace}:redislab

# Case 5 - Cache Penetration: TTL ngắn cho marker "không tồn tại"
app.redis-lab.null-cache-ttl=30s

# Case 7 - Cache Stampede: lock timeout (tự hết hạn nếu instance giữ lock chết) +
# thời gian tối đa 1 request "thua" chờ trước khi tự đọc lại cache
app.redis-lab.stampede-lock-ttl=5s
app.redis-lab.stampede-wait-timeout=2s
app.redis-lab.stampede-poll-interval=50ms

# Case 6 - Cache Avalanche: TTL gốc + biên độ random cộng thêm khi bật jitter
app.redis-lab.avalanche-base-ttl=60s
app.redis-lab.avalanche-jitter-max=30s

# Log rõ [CACHE]/[DB]/[REDIS] cho toàn bộ luồng test lab (mặc định app đang set
# logging.level.guru.springframework=error nên phải bật riêng ở mức INFO cho 2 class này,
# theo đúng cách application.properties gốc đã làm cho AnalyticsServiceImpl/...)
logging.level.guru.springframework.ghd.services.impl.RedisLabServiceImpl=INFO
logging.level.guru.springframework.ghd.services.RedisLabMetrics=INFO

# Widen actuator chỉ trong phạm vi profile lab để có thể quan sát thêm khi cần -
# KHÔNG áp dụng cho production (application.properties gốc vẫn chỉ health,info)
management.endpoints.web.exposure.include=health,info,metrics
