services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-docker}
      # DB/Redis hosts are always the Compose service names, never localhost/.env overrides
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-core}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      AES_SECRET: ${AES_SECRET:?AES_SECRET is required}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-localhost}
      SESSION_TIMEOUT: ${SESSION_TIMEOUT:-30m}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-GHDSESSION}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_COOKIE_SAME_SITE: ${SESSION_COOKIE_SAME_SITE:-lax}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      # VNPay - xem application.properties (không có default, thiếu thì
      # VnpayServiceImpl.buildPaymentUrl fail rõ ràng) + .claude/skills/vnpay-payment/SKILL.md
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:-}
      VNPAY_PAY_URL: ${VNPAY_PAY_URL:-}
      VNPAY_API_URL: ${VNPAY_API_URL:-}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:18080}
      # Internal PLAINTEXT listener (see the kafka service below) - not the
      # PLAINTEXT_HOST listener, which is only for host-side tools/localhost access.
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      UPLOAD_PATH: /app/uploads
      SEO_STATIC_PATH: /app/seo
      LOG_PATH: /app/logs
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - uploads_data:/app/uploads
      - seo_data:/app/seo
      - logs_data:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    restart: unless-stopped
    stop_grace_period: 30s
    networks:
      - ghd-net

  mysql:
    image: mysql:8.4.11
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${DB_NAME:-core}
      MYSQL_USER: ${DB_USERNAME:?DB_USERNAME is required}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      # The official MySQL image runs every *.sql file under /docker-entrypoint-initdb.d
      # exactly once - only when /var/lib/mysql is completely empty (true first boot of
      # this volume). On every later start it's a no-op, since the data directory is no
      # longer empty. This seeds the DB straight from the latest local dump instead of
      # starting from Flyway's empty schema; Flyway still validates on app startup and
      # applies any migrations newer than what the dump already contains.
      # See scripts/mysql-init.sql for why that older script is NOT mounted here (it
      # targets a different db user/schema left over from another environment).
      - ./backups/core-local-dump.sql:/docker-entrypoint-initdb.d/01-core-dump.sql:ro
    healthcheck:
      # $$ keeps the password out of `docker compose config` output; the container's
      # own shell resolves it from its environment at healthcheck-run time.
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - ghd-net

  redis:
    image: redis:7.4.10-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    # See docs/DOCKER.md "Redis password trade-off" - the official image has no
    # `--requirepass-file`/env-only auth option, so the password still ends up as a
    # process argument inside the container (visible to `docker top`/`ps` with host
    # access). Using $$ + a shell entrypoint at least keeps it out of the compose
    # file and `docker compose config` output.
    entrypoint: ["sh", "-c", "redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    networks:
      - ghd-net

  kafka:
    image: apache/kafka:3.9.0
    environment:
      # Single-node KRaft broker (no Zookeeper). order-events/user-events (see
      # guru.springframework.ghd.config.KafkaTopicConfig) are notification-only and
      # low-volume, so 1 broker/partition is enough for this project's current scale.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:19093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:19093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks:
      - ghd-net

volumes:
  mysql_data:
  redis_data:
  uploads_data:
  seo_data:
  logs_data:
  kafka_data:

networks:
  ghd-net:
    driver: bridge
